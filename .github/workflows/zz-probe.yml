name: zz Probe (temporary)

# Temporary, workflow_dispatch only. Two questions this repo cannot answer
# from a darwin laptop:
#   1. which Intel macOS runner labels GitHub still serves;
#   2. what (provider, event id, opcode, version) tuples a hosted
#      windows-latest runner actually delivers over ETW.
# Delete this file once both are answered.

on:
  workflow_dispatch:
  # workflow_dispatch alone is unusable here: GitHub only offers it for
  # workflows present on the default branch, and this file never will be.
  push:
    branches: [feature/ebpf-accept-addresses]

env:
  GOTOOLCHAIN: local

jobs:
  windows-etw-shape:
    name: Windows ETW event shape
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: ETW shape diagnostic
        env:
          CGO_ENABLED: "0"
        run: go test -tags=integration ./internal/kernel/ -count=1 -v -timeout 600s -run TestWindowsETWEventShapeDiagnostic

  linux-ebpf-verifier:
    name: Linux eBPF per-program verifier log
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Prepare Linux eBPF toolchain
        run: bash scripts/ci/setup_linux_ebpf.sh
      - name: Build and link eBPF objects
        run: make ebpf ebpf-link
      - name: Per-program load diagnostic
        env:
          CGO_ENABLED: "0"
        run: |
          uname -r
          sudo -E env "PATH=$PATH" "EDR_BPF_OBJECT=$PWD/platform/linux/ebpf/edr.bpf.o" \
            go test -tags=integration ./internal/kernel/ -count=1 -v -timeout 900s \
            -run TestLinuxEBPFPerProgramLoadDiagnostic
