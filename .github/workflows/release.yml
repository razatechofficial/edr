# Publishes installable artifacts for all three platforms to a GitHub Release.
#
# Triggers:
#   - Push tag matching v*     → stable release (prerelease=false), tag = ref
#   - Push branch prod         → prerelease; unique tag prod-<run>-<sha>; package
#     version string from `git describe --tags --always` (falls back if no tags)
#   - workflow_dispatch        → same as prod push semantics for the selected ref
#
# Testers download .deb / .rpm / .pkg / .msi from the Releases page (or API).
# macOS notarized signing: set repo secret APPLE_SIGN_IDENTITY when keys are on the runner.

name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_meta:
    runs-on: ubuntu-latest
    outputs:
      pkg_version: ${{ steps.meta.outputs.pkg_version }}
      msi_version: ${{ steps.meta.outputs.msi_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve package and release identifiers
        id: meta
        run: |
          set -euo pipefail
          # WiX Product/@Version must be numeric a.b.c.d (each segment <= 65535).
          msi_version_from() {
            local x="${1#v}"
            x="${x%%-*}"
            if [[ "$x" =~ ^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}$ ]]; then
              echo "${x}.0"
              return 0
            fi
            local r=$((${GITHUB_RUN_NUMBER:-0} % 65535))
            if [ "$r" -eq 0 ]; then r=1; fi
            echo "0.0.${r}.0"
          }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "pkg_version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "msi_version=$(msi_version_from "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PKG="$(git describe --tags --always --dirty 2>/dev/null || true)"
          if [ -z "${PKG}" ]; then
            PKG="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "pkg_version=${PKG}" >> "$GITHUB_OUTPUT"
          echo "msi_version=$(msi_version_from "${PKG}")" >> "$GITHUB_OUTPUT"
          SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "release_tag=prod-${GITHUB_RUN_NUMBER}-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=true" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: release_meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install deps
        run: |
          bash scripts/ci/setup_linux_ebpf.sh
          make ebpf
          make ebpf-link
      - name: Build linux
        run: LINUX_CGO=1 make build-linux
      - name: Package deb/rpm
        run: bash build/linux/package.sh "${{ needs.release_meta.outputs.pkg_version }}" amd64
      - name: Verify complete Linux package
        run: |
          DEB="$(ls -1 dist/edr-agent_*_amd64.deb | head -1)"
          bash scripts/verify_linux_package.sh "${DEB}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm

  build-darwin:
    needs: release_meta
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build production macOS agent
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: bash scripts/ci/build_macos_production.sh
      - name: Package pkg
        run: bash build/macos/package.sh "${{ needs.release_meta.outputs.pkg_version }}" "$(go env GOARCH)"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/*.pkg

  build-windows:
    needs: release_meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Windows binaries
        shell: bash
        run: bash scripts/ci/build_windows_binaries.sh
      - name: Ensure WiX (candle/light) on PATH
        shell: pwsh
        run: pwsh -NoProfile -File "${{ github.workspace }}/scripts/ci/ensure_wix_path.ps1"
      - name: Build MSI
        shell: cmd
        run: build\windows\build_msi.bat "${{ needs.release_meta.outputs.msi_version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist\*.msi

  release:
    needs: [release_meta, build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.release_meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.release_meta.outputs.is_prerelease == 'true' }}
          name: ${{ needs.release_meta.outputs.is_prerelease == 'true' && format('Prod build {0}', needs.release_meta.outputs.pkg_version) || needs.release_meta.outputs.pkg_version }}
          generate_release_notes: true
          files: |
            linux-packages/*.deb
            linux-packages/*.rpm
            macos-packages/*.pkg
            windows-packages/*.msi
