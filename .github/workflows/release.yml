# Publishes installable artifacts for all three platforms to a GitHub Release.
#
# Triggers:
#   - Push tag matching v*     → stable release (prerelease=false), tag = ref
#   - Push branch prod         → prerelease; unique tag prod-<run>-<sha>; package
#     version string from `git describe --tags --always` (falls back if no tags)
#   - workflow_dispatch        → same as prod push semantics for the selected ref
#
# Testers download one attended file per OS:
#   macOS  EDR-Agent-Setup_apple-silicon.pkg / EDR-Agent-Setup_intel.pkg
#   Windows EDR-Agent-Setup.exe  (custom wizard → dashboard)
#   Linux  .deb / .rpm
# Windows MSI remains for GPO/silent. No separate macOS MDM pkg.
# macOS signed release secrets:
#   APPLE_SIGN_IDENTITY, APPLE_INSTALLER_SIGN_IDENTITY
#   APPLE_CERTIFICATE_P12 (base64 .p12), APPLE_CERTIFICATE_PASSWORD
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_SPECIFIC_PASSWORD, NOTARY_KEYCHAIN_PROFILE
# Windows Authenticode release secrets (optional):
#   WINDOWS_SIGN_PFX_BASE64, WINDOWS_SIGN_PFX_PASSWORD, WINDOWS_SIGN_TIMESTAMP_URL

name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release_meta:
    runs-on: ubuntu-latest
    outputs:
      pkg_version: ${{ steps.meta.outputs.pkg_version }}
      msi_version: ${{ steps.meta.outputs.msi_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0
      - name: Resolve package and release identifiers
        id: meta
        run: |
          set -euo pipefail
          # WiX Product/@Version must be numeric a.b.c.d (each segment <= 65535).
          msi_version_from() {
            local x="${1#v}"
            x="${x%%-*}"
            # WiX Product/@Version: a.b.c.d, each segment 0-65535.
            if [[ "$x" =~ ^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}$ ]]; then
              echo "$x"
              return 0
            fi
            if [[ "$x" =~ ^[0-9]{1,5}\.[0-9]{1,5}\.[0-9]{1,5}$ ]]; then
              echo "${x}.0"
              return 0
            fi
            local r=$((${GITHUB_RUN_NUMBER:-0} % 65535))
            if [ "$r" -eq 0 ]; then r=1; fi
            echo "0.0.${r}.0"
          }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "pkg_version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "msi_version=$(msi_version_from "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PKG="$(git describe --tags --always --dirty 2>/dev/null || true)"
          if [ -z "${PKG}" ]; then
            PKG="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "pkg_version=${PKG}" >> "$GITHUB_OUTPUT"
          echo "msi_version=$(msi_version_from "${PKG}")" >> "$GITHUB_OUTPUT"
          SHORT="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "release_tag=prod-${GITHUB_RUN_NUMBER}-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.release_tag }}"
          if [ "${{ steps.meta.outputs.is_prerelease }}" = "true" ]; then
            TITLE="Prod build ${{ steps.meta.outputs.pkg_version }}"
            PRE=(--prerelease)
          else
            TITLE="${{ steps.meta.outputs.pkg_version }}"
            PRE=()
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" "${PRE[@]}" --target "${{ github.sha }}" --generate-notes --title "$TITLE"

  build-linux:
    needs: [release_meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Ensure ONNX models
        run: bash scripts/ci/ensure_onnx_models.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install deps
        run: |
          bash scripts/ci/setup_linux_ebpf.sh
          make ebpf
          make ebpf-link
      - name: Build linux
        run: LINUX_CGO=1 make build-linux
      - name: Package deb/rpm
        run: bash build/linux/package.sh "${{ needs.release_meta.outputs.pkg_version }}" amd64
      - name: Verify complete Linux package
        run: |
          DEB="$(ls -1 dist/edr-agent_*_amd64.deb | head -1)"
          bash scripts/verify_linux_package.sh "${DEB}"
      - name: Attach Linux packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.deb dist/*.rpm)
          gh release upload "${{ needs.release_meta.outputs.release_tag }}" "${files[@]}" --clobber

  build-darwin:
    needs: [release_meta]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      EDR_MACOS_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Ensure ONNX models
        run: bash scripts/ci/ensure_onnx_models.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Import Apple signing certificate (${{ matrix.arch }})
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_INSTALLER_SIGN_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGN_IDENTITY }}
        run: bash scripts/ci/import_apple_signing.sh
      - name: Install macOS build dependencies (${{ matrix.arch }})
        run: bash scripts/ci/setup_macos_build.sh
      - name: Build production macOS agent (${{ matrix.arch }})
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: bash scripts/ci/macos_run_build.sh bash scripts/ci/build_macos_production.sh
      - name: Package macOS installer (${{ matrix.arch }})
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: bash scripts/ci/macos_run_build.sh bash build/macos/package.sh "${{ needs.release_meta.outputs.pkg_version }}" "${{ matrix.arch }}"
      - name: Verify macOS package (${{ matrix.arch }})
        run: |
          PKG="dist/edr-agent_${{ needs.release_meta.outputs.pkg_version }}_${{ matrix.arch }}.pkg"
          bash scripts/verify_macos_pkg.sh "${PKG}"
      - name: Sign and notarize pkg (${{ matrix.arch }})
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGN_IDENTITY }}
          NOTARY_KEYCHAIN_PROFILE: ${{ secrets.NOTARY_KEYCHAIN_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_SKIP: ${{ needs.release_meta.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGN_IDENTITY:-}" && -z "${NOTARY_KEYCHAIN_PROFILE:-}" && -z "${APPLE_ID:-}" ]]; then
            echo "Skipping pkg sign/notarize (secrets not configured)"
            exit 0
          fi
          bash scripts/ci/setup_apple_notary.sh
          PKG="dist/edr-agent_${{ needs.release_meta.outputs.pkg_version }}_${{ matrix.arch }}.pkg"
          # Native arch: notarytool under Rosetta on Apple Silicon runners
          # often dies with NSURLError -1009 (no network route) while polling.
          bash scripts/notarize_macos_pkg.sh "${PKG}"
      - name: Attach macOS package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/edr-agent_*_${{ matrix.arch }}.pkg)
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            for f in dist/edr-agent_*_arm64.pkg; do
              [[ -f "${f}" ]] || continue
              cp "${f}" "${f%_arm64.pkg}_apple-silicon.pkg"
              cp "${f}" dist/EDR-Agent-Setup_apple-silicon.pkg
            done
            files+=(dist/edr-agent_*_apple-silicon.pkg dist/EDR-Agent-Setup_apple-silicon.pkg)
          else
            for f in dist/edr-agent_*_amd64.pkg; do
              [[ -f "${f}" ]] || continue
              cp "${f}" "${f%_amd64.pkg}_intel.pkg"
              cp "${f}" dist/EDR-Agent-Setup_intel.pkg
            done
            files+=(dist/edr-agent_*_intel.pkg dist/EDR-Agent-Setup_intel.pkg)
          fi
          gh release upload "${{ needs.release_meta.outputs.release_tag }}" "${files[@]}" --clobber

  build-windows:
    needs: [release_meta]
    # windows-latest is moving to VS2026-based images; WiX v3 zip tools are more reliable on windows-2022.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: Ensure ONNX models
        shell: bash
        run: bash scripts/ci/ensure_onnx_models.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Windows YARA toolchain
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/ci/setup_windows_yara.ps1"
      - name: Build Windows binaries
        shell: bash
        run: bash scripts/ci/build_windows_binaries.sh
      - name: Sign Windows agent (Authenticode)
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          & "${{ github.workspace }}/scripts/ci/sign_windows_authenticode.ps1" -Root "${{ github.workspace }}"
      - name: Verify Windows YARA bundle
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/ci/verify_windows_yara.ps1"
      # Single pwsh session: ensure_wix_path mutates PATH; avoids any runner PATH ordering issues between steps.
      - name: WiX toolchain and MSI
        shell: pwsh
        run: |
          Set-Location "${{ github.workspace }}"
          & "${{ github.workspace }}/scripts/ci/ensure_wix_path.ps1"
          $v = "${{ needs.release_meta.outputs.msi_version }}".Trim().TrimEnd([char]0x0D).TrimEnd([char]0x0A)
          if ([string]::IsNullOrWhiteSpace($v)) { $v = '1.0.0.0' }
          # Invoke candle/light from PowerShell (no cmd.exe string); avoids path parsing bugs with D:\a\... on GHA.
          & "${{ github.workspace }}/scripts/ci/build_windows_msi.ps1" -Version $v
      - name: Verify Windows MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path dist -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'no MSI found under dist/' }
          & "${{ github.workspace }}/scripts/ci/verify_windows_msi.ps1" -MsiPath $msi.FullName
      - name: Sign Windows MSI (Authenticode)
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
          WINDOWS_SIGN_TIMESTAMP_URL: ${{ secrets.WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          & "${{ github.workspace }}/scripts/ci/sign_windows_authenticode.ps1" -Root "${{ github.workspace }}" -MsiOnly
          if ($env:WINDOWS_SIGN_PFX_BASE64) {
            & "${{ github.workspace }}/scripts/ci/sign_windows_authenticode.ps1" -Root "${{ github.workspace }}" -VerifyOnly
          }
      - name: Show WiX logs on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($p in @('build/windows/candle.log', 'build/windows/light.log')) {
            if (Test-Path -LiteralPath $p) {
              Write-Host "::group::$p"
              Get-Content -LiteralPath $p
              Write-Host "::endgroup::"
            }
          }
      - name: Attach MSI to GitHub Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.msi dist/EDR-Agent-Setup.exe)
          gh release upload "${{ needs.release_meta.outputs.release_tag }}" "${files[@]}" --clobber
