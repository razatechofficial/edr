name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Install eBPF build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-16 llvm-16 libbpf-dev \
            linux-headers-$(uname -r) \
            linux-tools-$(uname -r) linux-tools-generic \
            || sudo apt-get install -y clang llvm libbpf-dev
          clang-16 --target=bpf -print-targets 2>&1 | grep -q bpf \
            || clang --target=bpf -print-targets 2>&1 | grep -q bpf \
            || (echo "ERROR: no BPF-capable clang found" && exit 1)
          if ! pkg-config --exists libbpf 2>/dev/null; then
            bash scripts/install_libbpf_headers.sh
          fi

      - name: Generate vmlinux.h
        if: runner.os == 'Linux'
        run: bash scripts/gen_vmlinux.sh

      - name: Build eBPF objects
        if: runner.os == 'Linux'
        run: make ebpf

      - name: Link eBPF + BPF version check
        if: runner.os == 'Linux'
        run: make ebpf-link bpf-version-check

      - name: Verify eBPF objects generated
        if: runner.os == 'Linux'
        run: |
          for f in platform/linux/ebpf/*.o; do
            echo "Generated: $f ($(stat -c%s $f) bytes)"
          done

      - name: Build agent
        run: make build

      - name: Unit tests
        run: make test

      - name: Collector tests (no CGO / no ESF link)
        run: make test-collector

      - name: Race detector
        run: make test-race

      - name: Detection engine tests
        run: make test-detection

      - name: Response engine tests
        run: make test-response

  integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod download

      - name: Integration tests
        run: go test -tags=integration -v ./tests/integration/...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod download

      - name: Generate coverage
        run: make test-coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  build-all:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build all platforms
        run: make build-all

      - name: Build darwin amd64 (nosec)
        run: |
          GOOS=darwin GOARCH=amd64 go build -tags nosec ./...

      - name: Build darwin arm64 (nosec)
        run: |
          GOOS=darwin GOARCH=arm64 go build -tags nosec ./...

      # Full ESF/cgo linkage is exercised on a macOS runner (see darwin-esf-matrix).
      # Cross-compiling linux→darwin cannot validate CGO=ON kernel builds reliably.

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: edr-binaries
          path: bin/

  darwin-esf-matrix:
    name: macOS build matrix (CGO / ESF)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        cgo_enabled: ["0", "1"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - run: go mod download

      - name: Build (CGO_ENABLED=${{ matrix.cgo_enabled }})
        env:
          CGO_ENABLED: ${{ matrix.cgo_enabled }}
        run: go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
