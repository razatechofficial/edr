name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Prepare Linux eBPF toolchain
        run: bash scripts/ci/setup_linux_ebpf.sh

      - name: Build eBPF objects
        run: make ebpf CLANG=clang-16

      - name: Link eBPF + BPF version check
        run: make ebpf-link bpf-version-check

      - name: Verify eBPF objects generated
        if: runner.os == 'Linux'
        run: |
          for f in platform/linux/ebpf/*.o; do
            echo "Generated: $f ($(stat -c%s $f) bytes)"
          done

      - name: Build agent
        env:
          CGO_ENABLED: "1"
          LINUX_CGO: "1"
        run: LINUX_CGO=1 make build-linux

      - name: Unit tests
        env:
          CGO_ENABLED: "1"
          LINUX_CGO: "1"
        run: make test-ci

      - name: Collector tests (no CGO / no ESF link)
        env:
          CGO_ENABLED: "0"
        run: make test-collector

      - name: Monitoring validation gates
        run: |
          go test -tags nosec ./cmd/agent -run 'TestMonitoringHealthGolden_Fixtures|TestMonitoringValidation_PlatformKernelContracts' -count=1
          go test -tags nosec ./cmd/agent -run 'TestRunMonitoringValidation_.*|TestAssertStrictNoPlaceholderSources_.*' -count=1
          go test -tags nosec ./internal/kernel/... ./internal/collector/... -run 'TestReattach|TestWatchdog|TestNetworkExtension|TestESFRevocation|TestLinuxFileDeduper|TestEffectiveLogTargets|TestLogTargetsCollectorHealthRows|TestPersistInventoryRecordsAndMaybeDelta|TestPrioritySampler_bias|TestClassifyTelemetryPriority|Test_sortedUint32Percentile' -count=1
          go test -tags nosec ./internal/response/... -run 'TestDefaultExecutorCollectArtifacts' -count=1

      - name: Windows driver stub (compile-test)
        run: GOOS=windows GOARCH=amd64 go test -c -o /dev/null ./internal/kernel/...

      - name: Race detector
        env:
          CGO_ENABLED: "1"
          LINUX_CGO: "1"
        run: make test-ci-race

      - name: Detection engine tests
        run: make test-detection

      - name: Response engine tests
        run: make test-response

  integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Integration tests
        env:
          CGO_ENABLED: "0"
        run: go test -tags=integration -v ./tests/integration/...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Generate coverage
        env:
          CGO_ENABLED: "0"
        run: make test-coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  build-all:
    name: Cross-compile
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all platforms
        run: make build-all

      - name: Build darwin amd64 (nosec)
        run: |
          GOOS=darwin GOARCH=amd64 go build -tags nosec ./...

      - name: Build darwin arm64 (nosec)
        run: |
          GOOS=darwin GOARCH=arm64 go build -tags nosec ./...

      # Full ESF/cgo linkage is exercised on a macOS runner (see darwin-esf-matrix).
      # Cross-compiling linux→darwin cannot validate CGO=ON kernel builds reliably.

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: edr-binaries
          path: bin/

  macos-production-build:
    name: macOS production build (ESF)
    runs-on: macos-latest
    env:
      # Full Xcode SDK carries EndpointSecurity; some runners default to CLT-only paths.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - name: Build production agent with EndpointSecurity
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: bash scripts/ci/build_macos_production.sh

      - name: Package macOS installer
        run: bash build/macos/package.sh "$(git describe --tags --always --dirty)" "$(go env GOARCH)"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-production-packages
          path: |
            dist/darwin-*/edr-agent
            dist/*.pkg
            bin/edrctl-darwin-*

  windows-monitoring-smoke:
    name: Windows monitoring smoke
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Run agent validation tests
        env:
          CGO_ENABLED: "0"
        run: go test -tags nosec ./cmd/agent -run "TestRunMonitoringValidation_.*|TestMonitoringValidation_PlatformKernelContracts" -count=1
      - name: Run response and config smoke tests
        run: |
          go test ./internal/response/... -run "TestDefaultExecutorCollectArtifacts" -count=1
          go test ./internal/config/... -run "TestValidateMonitoringWindowsControlPlaneRequired|TestValidateLogTargetsOSCompatibility" -count=1

