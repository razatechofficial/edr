  package-linux:
    name: Package Linux (deb + SQA)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-16 llvm-16 libbpf-dev libyara-dev pkg-config \
            linux-headers-$(uname -r) \
            linux-tools-$(uname -r) linux-tools-generic \
            || sudo apt-get install -y clang llvm libbpf-dev libyara-dev pkg-config
          if ! pkg-config --exists libbpf 2>/dev/null; then
            bash scripts/install_libbpf_headers.sh
          fi

      - name: Generate vmlinux.h
        env:
          EDR_VMLINUX_FALLBACK: "1"
        run: bash scripts/gen_vmlinux.sh

      - name: Build SQA/Linux packages
        env:
          CGO_ENABLED: "1"
          LINUX_CGO: "1"
        run: bash scripts/package_sqa_kali.sh

      - name: Verify Linux .deb
        run: |
          DEB="$(ls -1 dist/edr-agent_*_amd64.deb | head -1)"
          bash scripts/verify_linux_package.sh "${DEB}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-sqa-packages
          path: |
            dist/edr-sqa-kali-*.tar.gz
            dist/edr-agent_*_amd64.deb

