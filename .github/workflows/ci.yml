name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Install bpftool (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y linux-tools-generic linux-tools-$(uname -r) \
            || sudo apt-get install -y bpftool

      - name: Generate vmlinux.h
        run: bash scripts/gen_vmlinux.sh

      - name: Build agent
        run: make build

      - name: Unit tests
        run: make test

      - name: Collector tests (no CGO / no ESF link)
        run: make test-collector

      - name: Race detector
        run: make test-race

      - name: Detection engine tests
        run: make test-detection

      - name: Response engine tests
        run: make test-response

  integration:
    name: Integration Tests (Linux)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod download

      - name: Integration tests
        run: go test -tags=integration -v ./tests/integration/...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod download

      - name: Generate coverage
        run: make test-coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html

  build-all:
    name: Cross-compile
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build all platforms
        run: make build-all

      - name: Darwin nosec build matrix
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go test -tags nosec ./internal/kernel/... -c
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go test -tags nosec ./internal/kernel/... -c

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: edr-binaries
          path: bin/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
