title: Screensaver Registry Backdoor
id: 0d1e2f3a-4b5c-4d6e-7f8a-9b0c1d2e3f4a
status: experimental
description: Detects modification of screensaver registry keys to execute arbitrary programs for persistence
references:
    - https://attack.mitre.org/techniques/T1546/002/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.t1546.002
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\Control Panel\Desktop'
        TargetObject|endswith:
            - '\SCRNSAVE.EXE'
            - '\ScreenSaveActive'
            - '\ScreenSaverIsSecure'
            - '\ScreenSaveTimeOut'
    selection_suspicious_scr:
        TargetObject|endswith: '\SCRNSAVE.EXE'
    filter_legitimate:
        Details|endswith:
            - '.scr'
            - 'scrnsave.scr'
            - 'PhotoScreensaver.scr'
    condition: selection and selection_suspicious_scr and not filter_legitimate
falsepositives:
    - Legitimate screensaver configuration
    - GPO screensaver settings
level: high
