title: Run/RunOnce Registry Key Modification
id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
status: experimental
description: Detects modification of Run and RunOnce registry keys commonly used for persistence
references:
    - https://attack.mitre.org/techniques/T1547/001/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run\'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce\'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunServices\'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunServicesOnce\'
            - '\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\Run\'
            - '\SOFTWARE\Wow6432Node\Microsoft\Windows\CurrentVersion\RunOnce\'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer\Run\'
    filter_trusted:
        Details|contains:
            - 'SecurityHealth'
            - 'OneDrive'
            - 'Windows Defender'
            - 'Microsoft\Edge'
    condition: selection and not filter_trusted
falsepositives:
    - Legitimate software installations adding auto-start entries
    - System configuration changes by administrators
level: medium
