title: Image File Execution Options Debugger Hijack
id: 3a4b5c6d-7e8f-4a9b-0c1d-2e3f4a5b6c7d
status: experimental
description: Detects setting of debugger values in IFEO registry keys to hijack execution of legitimate programs for persistence or privilege escalation
references:
    - https://attack.mitre.org/techniques/T1546/012/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1546.012
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\'
        TargetObject|endswith: '\Debugger'
    selection_silent_exit:
        TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\SilentProcessExit\'
        TargetObject|endswith:
            - '\MonitorProcess'
            - '\ReportingMode'
    condition: selection or selection_silent_exit
falsepositives:
    - Software developers using debuggers
    - Application compatibility tools
level: high
