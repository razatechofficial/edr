title: Winlogon Registry Modification
id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
status: experimental
description: Detects modification of Winlogon registry keys used for persistence during the Windows logon process
references:
    - https://attack.mitre.org/techniques/T1547/004/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.t1547.004
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\'
        TargetObject|endswith:
            - '\Shell'
            - '\Userinit'
            - '\Notify'
            - '\GinaDLL'
            - '\System'
            - '\Taskman'
            - '\UIHost'
    filter_default:
        Details|contains:
            - 'explorer.exe'
            - 'userinit.exe'
    condition: selection and not filter_default
falsepositives:
    - Custom shell replacements in enterprise environments
    - Legitimate third-party logon managers
level: high
