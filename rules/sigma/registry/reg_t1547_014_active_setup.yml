title: Active Setup Registry Persistence
id: 0b1c2d3e-4f5a-4b6c-7d8e-9f0a1b2c3d4e
status: experimental
description: Detects modification of Active Setup registry keys used for persistence that execute commands when a user logs on
references:
    - https://attack.mitre.org/techniques/T1547/014/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.t1547.014
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\SOFTWARE\Microsoft\Active Setup\Installed Components\'
        TargetObject|endswith:
            - '\StubPath'
    filter_known:
        Details|contains:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
            - '{44BBA840-CC51-11CF-AAFA-00AA00B6015C}'
            - '{89820200-ECBD-11cf-8B85-00AA005B4383}'
            - '{22d6f312-b0f6-11d0-94ab-0080c74c7e95}'
    condition: selection and not filter_known
falsepositives:
    - Legitimate software using Active Setup for first-run configuration
    - Microsoft Office installations
level: high
