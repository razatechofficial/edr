title: Application Compatibility Shim Registry Modification
id: 2f3a4b5c-6d7e-4f8a-9b0c-1d2e3f4a5b6c
status: experimental
description: Detects modification of application compatibility (shim) database registry entries used for persistence and privilege escalation
references:
    - https://attack.mitre.org/techniques/T1546/011/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1546.011
logsource:
    category: registry_set
    product: windows
detection:
    selection_installed_sdb:
        TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\'
    selection_custom:
        TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Custom\'
    selection_layers:
        TargetObject|contains: '\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers'
    condition: selection_installed_sdb or selection_custom or selection_layers
falsepositives:
    - Legitimate application compatibility fixes
    - Enterprise application deployment
level: medium
