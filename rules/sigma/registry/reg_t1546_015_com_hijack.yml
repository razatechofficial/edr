title: COM Object Hijacking via Registry
id: 4b5c6d7e-8f9a-4b0c-1d2e-3f4a5b6c7d8e
status: experimental
description: Detects COM object hijacking through modification of InprocServer32 or LocalServer32 registry keys
references:
    - https://attack.mitre.org/techniques/T1546/015/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.t1546.015
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\Classes\CLSID\'
        TargetObject|endswith:
            - '\InprocServer32\(Default)'
            - '\InprocServer32\'
            - '\LocalServer32\(Default)'
            - '\LocalServer32\'
            - '\TreatAs\'
    filter_system:
        Details|contains:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
    condition: selection and not filter_system
falsepositives:
    - Legitimate COM object registrations
    - Software installations
level: medium
