title: System Recovery Inhibition
id: f8b2c6d5-7e0a-4c4f-b06d-5f9e1a7c4d03
status: experimental
description: Detects attempts to inhibit system recovery by deleting shadow copies, disabling recovery mode, deleting backup catalogs, or disabling Windows recovery features used by ransomware to prevent victims from restoring data.
references:
    - https://attack.mitre.org/techniques/T1490/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.impact
    - attack.t1490
logsource:
    category: process_creation
detection:
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains:
            - 'delete shadows'
            - 'resize shadowstorage'
    selection_wmic_shadow:
        Image|endswith: '\wmic.exe'
        CommandLine|contains:
            - 'shadowcopy delete'
            - 'shadowcopy list'
    selection_powershell_shadow:
        CommandLine|contains:
            - 'Get-WmiObject Win32_ShadowCopy'
            - 'Win32_ShadowCopy'
            - '.Delete()'
    selection_bcdedit:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains:
            - 'recoveryenabled no'
            - 'bootstatuspolicy ignoreallfailures'
            - 'set {default} recoveryenabled no'
    selection_wbadmin:
        Image|endswith: '\wbadmin.exe'
        CommandLine|contains:
            - 'delete catalog'
            - 'delete systemstatebackup'
            - 'delete backup'
    selection_reagentc:
        Image|endswith: '\reagentc.exe'
        CommandLine|contains: '/disable'
    selection_linux_recovery:
        CommandLine|contains:
            - 'rm -rf /boot'
            - 'dd if=/dev/zero of=/dev/sda'
            - 'mkfs.'
            - 'shred /dev/sda'
    condition: selection_vssadmin or selection_wmic_shadow or selection_powershell_shadow or selection_bcdedit or selection_wbadmin or selection_reagentc or selection_linux_recovery
falsepositives:
    - Legitimate shadow copy management for disk space
    - System administrators reconfiguring boot options
    - Disaster recovery testing
level: critical
