title: Ransomware - Mass File Encryption Indicators
id: f8b2c6d5-7e0a-4c4f-b06d-5f9e1a7c4d01
status: experimental
description: Detects indicators of ransomware activity including mass file encryption, ransom note creation, and use of known ransomware-related tools or file extensions.
references:
    - https://attack.mitre.org/techniques/T1486/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.impact
    - attack.t1486
logsource:
    category: process_creation
detection:
    selection_encryption_tools:
        CommandLine|contains:
            - 'cipher /e'
            - 'openssl enc -aes'
            - 'gpg --batch --yes --encrypt'
            - 'encrypt'
    selection_ransom_extensions:
        TargetFilename|endswith:
            - '.encrypted'
            - '.locked'
            - '.crypt'
            - '.cry'
            - '.enc'
            - '.locky'
            - '.cerber'
            - '.zepto'
            - '.dharma'
            - '.wallet'
            - '.onion'
            - '.WNCRY'
            - '.wcry'
    selection_ransom_notes:
        TargetFilename|contains:
            - 'README_RECOVERY'
            - 'HOW_TO_DECRYPT'
            - 'DECRYPT_INSTRUCTIONS'
            - 'RANSOM_NOTE'
            - 'YOUR_FILES_ARE_ENCRYPTED'
            - '_RECOVERY_+'
            - 'HELP_DECRYPT'
            - '!RESTORE'
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains: 'delete shadows'
    selection_bcdedit_recovery:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains:
            - 'recoveryenabled no'
            - 'bootstatuspolicy ignoreallfailures'
    condition: selection_encryption_tools or selection_ransom_extensions or selection_ransom_notes or selection_vssadmin or selection_bcdedit_recovery
falsepositives:
    - Legitimate encryption operations (full-disk encryption, file vault)
    - File encryption utilities used for data protection
    - System recovery configuration changes during deployment
level: critical
