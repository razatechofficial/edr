title: Credential Dumping Tool Execution
id: e91d34a7-8cd9-4eab-bc23-dc9defae8a01
status: experimental
description: Detects execution of well-known credential dumping tools such as Mimikatz, ProcDump targeting LSASS, secretsdump, and other password extraction utilities.
references:
    - https://attack.mitre.org/techniques/T1003/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.credential_access
    - attack.t1003
logsource:
    category: process_creation
    product: windows
detection:
    selection_mimikatz:
        CommandLine|contains:
            - 'mimikatz'
            - 'sekurlsa::'
            - 'kerberos::list'
            - 'kerberos::ptt'
            - 'lsadump::'
            - 'crypto::certificates'
            - 'privilege::debug'
            - 'token::elevate'
            - 'vault::cred'
            - 'dpapi::cred'
    selection_mimikatz_image:
        OriginalFileName|contains:
            - 'mimikatz'
            - 'mimilib'
    selection_procdump_lsass:
        Image|endswith: '\procdump.exe'
        CommandLine|contains:
            - 'lsass'
    selection_secretsdump:
        CommandLine|contains:
            - 'secretsdump'
            - 'hashdump'
            - 'gsecdump'
            - 'wce -w'
            - 'pwdumpx'
            - 'fgdump'
            - 'cachedump'
    selection_lazagne:
        CommandLine|contains:
            - 'lazagne'
            - 'LaZagne'
    condition: selection_mimikatz or selection_mimikatz_image or selection_procdump_lsass or selection_secretsdump or selection_lazagne
falsepositives:
    - Authorized penetration testing engagements
    - Security tool evaluation
level: critical
