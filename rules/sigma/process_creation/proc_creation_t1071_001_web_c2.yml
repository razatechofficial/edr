title: HTTP/HTTPS Command and Control Patterns
id: ab1f3c47-8ea4-4fde-ef23-fab4fabc8c01
status: experimental
description: Detects processes exhibiting patterns consistent with HTTP/HTTPS-based command and control communication, including beaconing tools and known C2 framework indicators.
references:
    - https://attack.mitre.org/techniques/T1071/001/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_cobalt_strike:
        CommandLine|contains:
            - 'cobaltstrike'
            - 'beacon.exe'
            - 'beacon_x64'
            - 'beacon_x86'
    selection_known_c2:
        CommandLine|contains:
            - 'meterpreter'
            - 'metasploit'
            - 'empire '
            - 'covenant'
            - 'sliver'
            - 'havoc'
            - 'brute ratel'
            - 'bruteratel'
    selection_powershell_c2:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Invoke-Empire'
            - 'Invoke-PsExec'
            - 'Invoke-Command -ComputerName'
            - 'New-PSSession -ComputerName'
            - 'Enter-PSSession'
            - 'Invoke-Mimikatz'
    selection_curl_post:
        Image|endswith:
            - '\curl.exe'
            - '/curl'
        CommandLine|contains:
            - '-X POST'
            - '--data-binary'
            - '-d @'
        CommandLine|contains:
            - '-H "Content-Type'
            - '-H "Authorization'
    selection_suspicious_agents:
        CommandLine|contains:
            - 'User-Agent'
            - 'Mozilla/4.0'
            - 'Mozilla/5.0'
        CommandLine|contains:
            - 'powershell'
            - 'cmd.exe'
    condition: selection_cobalt_strike or selection_known_c2 or selection_powershell_c2 or selection_curl_post or selection_suspicious_agents
falsepositives:
    - Penetration testing and red team exercises
    - Security tools that simulate C2 traffic
    - Legitimate API calls using curl with POST
level: high
