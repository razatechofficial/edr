title: File Download via System Utilities
id: fa8e0b14-5de6-4fbc-cd90-edf6edaf5b78
status: experimental
description: Detects use of built-in Windows and Linux utilities to download files from the internet, commonly used by attackers for payload staging without requiring additional tools.
references:
    - https://attack.mitre.org/techniques/T1105/
    - https://lolbas-project.github.io/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.command_and_control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-urlcache'
            - 'http://'
            - 'https://'
            - 'ftp://'
    selection_bitsadmin:
        Image|endswith: '\bitsadmin.exe'
        CommandLine|contains:
            - '/transfer'
            - '/addfile'
            - 'http://'
            - 'https://'
    selection_curl:
        Image|endswith:
            - '\curl.exe'
            - '/curl'
        CommandLine|contains:
            - ' -o '
            - ' -O '
            - '--output'
            - 'http://'
            - 'https://'
    selection_wget:
        Image|endswith:
            - '\wget.exe'
            - '/wget'
    selection_powershell_download:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Invoke-WebRequest'
            - 'Start-BitsTransfer'
            - 'iwr'
            - 'Net.WebClient'
    selection_expand:
        Image|endswith: '\expand.exe'
        CommandLine|contains:
            - 'http://'
            - 'https://'
    condition: selection_certutil or selection_bitsadmin or selection_curl or selection_wget or selection_powershell_download or selection_expand
falsepositives:
    - System administrators downloading patches and updates
    - Legitimate software update mechanisms
    - Package managers (Chocolatey, winget, scoop)
level: medium
