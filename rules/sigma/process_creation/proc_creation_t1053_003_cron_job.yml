title: Cron Job Manipulation for Persistence
id: d2a6e7f0-1bd2-4df4-a5b6-cb2c7e9d1f3a
status: experimental
description: Detects suspicious cron job creation or modification, including direct crontab edits and writing to cron directories, commonly used for persistence on Linux systems.
references:
    - https://attack.mitre.org/techniques/T1053/003/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1053.003
    - attack.persistence
logsource:
    category: process_creation
    product: linux
detection:
    selection_crontab:
        Image|endswith: '/crontab'
        CommandLine|contains:
            - '-e'
            - '-l'
            - '-r'
    selection_cron_write:
        CommandLine|contains:
            - '/etc/cron.d/'
            - '/etc/cron.daily/'
            - '/etc/cron.hourly/'
            - '/etc/cron.weekly/'
            - '/etc/cron.monthly/'
            - '/var/spool/cron/'
            - '/etc/crontab'
    selection_cron_redirect:
        CommandLine|contains:
            - 'echo *>> /etc/cron'
            - 'echo *> /etc/cron'
            - 'echo *>> /var/spool/cron'
            - 'echo *> /var/spool/cron'
            - 'crontab -'
    selection_suspicious_content:
        CommandLine|contains:
            - 'curl'
            - 'wget'
            - '/dev/tcp'
            - 'base64'
            - 'python'
            - 'bash -i'
            - 'nc '
            - 'ncat '
    condition: selection_crontab or selection_cron_write or (selection_cron_redirect and selection_suspicious_content)
falsepositives:
    - System administrators managing cron jobs
    - Configuration management tools (Ansible, Puppet, Chef)
    - Package post-installation scripts
level: medium
