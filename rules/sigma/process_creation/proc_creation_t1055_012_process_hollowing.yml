title: Process Hollowing Indicators
id: d80c23f6-7bc8-4dfa-ab12-cb8cdefd7f90
status: experimental
description: Detects indicators of process hollowing where a legitimate process is started in a suspended state and its memory is replaced with malicious code. This is identified by suspicious parent-child process relationships and suspended process creation.
references:
    - https://attack.mitre.org/techniques/T1055/012/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.defense_evasion
    - attack.t1055.012
    - attack.privilege_escalation
logsource:
    category: process_creation
    product: windows
detection:
    selection_powershell_hollowing:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'NtUnmapViewOfSection'
            - 'ZwUnmapViewOfSection'
            - 'CREATE_SUSPENDED'
            - 'ResumeThread'
            - 'SetThreadContext'
            - 'Wow64SetThreadContext'
            - 'NtResumeThread'
    selection_svchost_wrong_parent:
        Image|endswith: '\svchost.exe'
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\regsvr32.exe'
    selection_suspended_indicators:
        CommandLine|contains:
            - 'Invoke-ProcessHollowing'
            - 'ProcessHollowing'
            - 'RunPE'
    condition: selection_powershell_hollowing or selection_svchost_wrong_parent or selection_suspended_indicators
falsepositives:
    - Very unlikely in normal operations
    - Security research or authorized red team exercises
level: critical
