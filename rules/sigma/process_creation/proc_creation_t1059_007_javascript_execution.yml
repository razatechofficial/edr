title: Suspicious JavaScript Runtime Execution
id: b0e4c5d8-9fb0-4bd2-e384-af0a5c7b9d1e
status: experimental
description: Detects Node.js or JScript execution with suspicious patterns such as inline eval, child_process spawning, or network socket creation indicating potential malicious activity.
references:
    - https://attack.mitre.org/techniques/T1059/007/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1059.007
logsource:
    category: process_creation
    product: windows
detection:
    selection_node:
        Image|endswith:
            - '\node.exe'
            - '/node'
    selection_node_suspicious:
        CommandLine|contains:
            - '-e "require(''child_process'
            - "-e 'require(\"child_process\""
            - 'child_process'
            - '.exec("cmd'
            - ".exec('cmd"
            - '.exec("powershell'
            - ".exec('powershell"
            - '.exec("/bin/sh'
            - ".exec('/bin/sh"
            - 'net.Socket'
            - 'dgram.createSocket'
    selection_jscript:
        Image|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
        CommandLine|contains:
            - '.js'
            - '.jse'
    selection_jscript_parent:
        ParentImage|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
    condition: (selection_node and selection_node_suspicious) or (selection_jscript) or (selection_jscript_parent)
falsepositives:
    - Legitimate Node.js applications and development workflows
    - Electron-based applications
    - Enterprise automation using JScript
level: medium
