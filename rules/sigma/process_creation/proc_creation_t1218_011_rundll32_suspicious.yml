title: Rundll32 Suspicious Usage Patterns
id: cd5b78e1-2ab3-4cef-fa67-bae3badc2e45
status: experimental
description: Detects suspicious usage of rundll32.exe including execution from unusual paths, loading DLLs from temp directories, or executing JavaScript/VBScript.
references:
    - https://attack.mitre.org/techniques/T1218/011/
    - https://lolbas-project.github.io/lolbas/Binaries/Rundll32/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.defense_evasion
    - attack.t1218.011
logsource:
    category: process_creation
    product: windows
detection:
    selection_rundll32:
        Image|endswith: '\rundll32.exe'
    selection_suspicious_dll_path:
        CommandLine|contains:
            - '\Temp\'
            - '\tmp\'
            - '\AppData\Local\'
            - '\AppData\Roaming\'
            - '\Users\Public\'
            - '\ProgramData\'
            - '\Downloads\'
    selection_script_execution:
        CommandLine|contains:
            - 'javascript:'
            - 'vbscript:'
            - 'mshtml'
            - 'RunHTMLApplication'
            - 'shell32.dll,Control_RunDLL'
            - 'shell32.dll,ShellExec_RunDLL'
    selection_no_args:
        CommandLine|endswith: 'rundll32.exe'
    selection_remote:
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - '\\\\'
    condition: selection_rundll32 and (selection_suspicious_dll_path or selection_script_execution or selection_no_args or selection_remote)
falsepositives:
    - Legitimate software using rundll32 to load DLLs from user directories
    - Control panel items invoked via shell32.dll
level: medium
