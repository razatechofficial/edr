title: SSH Lateral Movement Patterns
id: ef9d1a25-6ce7-4dab-bc01-def2defa6a89
status: experimental
description: Detects suspicious SSH usage patterns that may indicate lateral movement, including connections with password authentication, dynamic port forwarding, and remote command execution.
references:
    - https://attack.mitre.org/techniques/T1021/004/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.lateral_movement
    - attack.t1021.004
logsource:
    category: process_creation
    product: linux
detection:
    selection_ssh:
        Image|endswith:
            - '/ssh'
            - '\ssh.exe'
    selection_suspicious_flags:
        CommandLine|contains:
            - '-o StrictHostKeyChecking=no'
            - '-o UserKnownHostsFile=/dev/null'
            - '-o GlobalKnownHostsFile=/dev/null'
            - 'sshpass'
    selection_tunnel:
        CommandLine|contains:
            - '-D '
            - '-L '
            - '-R '
            - '-N -f'
            - '-fN '
    selection_remote_exec:
        CommandLine|re: 'ssh\s+.*@.*\s+(bash|sh|python|perl|ruby|curl|wget|chmod|nc)'
    selection_sshpass:
        Image|endswith: '/sshpass'
    selection_key_theft:
        CommandLine|contains:
            - '.ssh/id_rsa'
            - '.ssh/id_ed25519'
            - '.ssh/id_ecdsa'
            - '.ssh/authorized_keys'
            - '.ssh/known_hosts'
    condition: (selection_ssh and selection_suspicious_flags) or (selection_ssh and selection_tunnel) or selection_remote_exec or selection_sshpass or selection_key_theft
falsepositives:
    - Legitimate SSH tunneling for development
    - Automated deployment systems using SSH
    - Jump host configurations
level: medium
