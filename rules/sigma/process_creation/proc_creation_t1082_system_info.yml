title: System Information Discovery Commands
id: fa4e6b70-1de2-4fbc-cd56-edc2edce1b34
status: experimental
description: Detects execution of system information discovery commands commonly used during the reconnaissance phase of an attack to gather details about the target host.
references:
    - https://attack.mitre.org/techniques/T1082/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.discovery
    - attack.t1082
logsource:
    category: process_creation
    product: windows
detection:
    selection_windows:
        Image|endswith:
            - '\systeminfo.exe'
            - '\hostname.exe'
            - '\whoami.exe'
    selection_wmic_info:
        Image|endswith: '\wmic.exe'
        CommandLine|contains:
            - 'os get'
            - 'computersystem get'
            - 'bios get'
            - 'cpu get'
            - 'memorychip'
            - 'diskdrive'
    selection_powershell_info:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Get-ComputerInfo'
            - 'Get-WmiObject Win32_OperatingSystem'
            - 'Get-CimInstance Win32_OperatingSystem'
            - 'Get-Host'
            - '$env:COMPUTERNAME'
            - '$env:USERNAME'
            - '[Environment]::OSVersion'
    selection_linux:
        Image|endswith:
            - '/uname'
            - '/hostname'
            - '/hostnamectl'
            - '/lsb_release'
            - '/cat'
        CommandLine|contains:
            - 'uname -a'
            - '/etc/os-release'
            - '/etc/issue'
            - '/proc/version'
            - 'lsb_release -a'
    condition: selection_windows or selection_wmic_info or selection_powershell_info or selection_linux
falsepositives:
    - System monitoring and inventory tools
    - Administrative scripts for system auditing
    - Configuration management and compliance checks
level: low
