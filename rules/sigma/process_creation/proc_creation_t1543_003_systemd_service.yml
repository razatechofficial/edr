title: Systemd Service Creation for Persistence
id: bc0a2d36-7fa8-4bde-ef12-afb8afbc7d90
status: experimental
description: Detects creation or modification of systemd service unit files and subsequent daemon-reload, commonly used for persistence on Linux systems.
references:
    - https://attack.mitre.org/techniques/T1543/003/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.persistence
    - attack.t1543.003
    - attack.privilege_escalation
logsource:
    category: process_creation
    product: linux
detection:
    selection_systemctl_enable:
        Image|endswith: '/systemctl'
        CommandLine|contains:
            - 'enable'
            - 'daemon-reload'
            - 'start'
    selection_service_file_write:
        CommandLine|contains:
            - '/etc/systemd/system/'
            - '/usr/lib/systemd/system/'
            - '/lib/systemd/system/'
            - '/run/systemd/system/'
            - '~/.config/systemd/user/'
    selection_suspicious_service_content:
        CommandLine|contains:
            - 'ExecStart='
            - 'ExecStartPre='
            - 'ExecStartPost='
    selection_combined_write_reload:
        CommandLine|contains:
            - '.service'
        CommandLine|contains:
            - 'bash'
            - 'curl'
            - 'wget'
            - 'python'
            - 'nc '
            - '/dev/tcp'
    condition: (selection_systemctl_enable and selection_combined_write_reload) or (selection_service_file_write and selection_suspicious_service_content) or (selection_service_file_write and selection_combined_write_reload)
falsepositives:
    - Legitimate package installations creating systemd services
    - System administrators configuring new services
    - Configuration management tools (Ansible, Puppet, Chef)
level: medium
