title: Process Enumeration and Discovery
id: cd7b9e03-4ac5-4bef-fa89-bcd0bcef4e67
status: experimental
description: Detects execution of process listing commands used to enumerate running processes, identify security software, or find target processes for injection.
references:
    - https://attack.mitre.org/techniques/T1057/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.discovery
    - attack.t1057
logsource:
    category: process_creation
    product: windows
detection:
    selection_tasklist:
        Image|endswith: '\tasklist.exe'
    selection_wmic_process:
        Image|endswith: '\wmic.exe'
        CommandLine|contains:
            - 'process list'
            - 'process get'
            - 'process where'
            - 'process call'
    selection_powershell_process:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Get-Process'
            - 'Get-WmiObject Win32_Process'
            - 'Get-CimInstance Win32_Process'
            - 'gwmi Win32_Process'
    selection_qprocess:
        Image|endswith:
            - '\qprocess.exe'
            - '\query.exe'
        CommandLine|contains: 'process'
    selection_linux:
        Image|endswith: '/ps'
        CommandLine|contains:
            - 'aux'
            - '-ef'
            - '-e'
            - 'axjf'
    selection_linux_proc:
        CommandLine|contains:
            - '/proc/*/cmdline'
            - '/proc/*/status'
            - '/proc/*/exe'
    condition: selection_tasklist or selection_wmic_process or selection_powershell_process or selection_qprocess or selection_linux or selection_linux_proc
falsepositives:
    - System monitoring tools
    - Process management scripts
    - Resource utilization checks
level: low
