title: Suspicious Unix Shell Execution Patterns
id: e7b1f2a5-6c8d-4eaf-b051-7c9d2f4e6a8b
status: experimental
description: Detects suspicious Unix shell patterns including reverse shells, base64 decode piped to execution, and other commonly abused shell one-liners used in post-exploitation.
references:
    - https://attack.mitre.org/techniques/T1059/004/
    - https://gtfobins.github.io/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1059.004
logsource:
    category: process_creation
    product: linux
detection:
    selection_reverse_shell:
        CommandLine|contains:
            - '/dev/tcp/'
            - '/dev/udp/'
            - 'bash -i >& '
            - 'sh -i >& '
            - 'exec 5<>/dev/tcp'
            - '0>&1'
            - 'nc -e /bin'
            - 'ncat -e /bin'
            - 'mkfifo'
            - 'mknod backpipe'
    selection_b64_pipe:
        CommandLine|contains:
            - 'base64 -d |'
            - 'base64 --decode |'
            - 'base64 -d|'
            - 'echo *| base64 -d'
            - 'base64 -w0'
    selection_eval_exec:
        CommandLine|contains:
            - 'eval $(echo'
            - 'eval "$(echo'
            - "eval '$(echo"
            - 'echo *| bash'
            - 'echo *| sh'
            - 'echo *| zsh'
            - 'python -c "import socket'
            - "python -c 'import socket"
            - 'python3 -c "import socket'
            - "python3 -c 'import socket"
            - 'perl -e "use Socket'
            - "perl -e 'use Socket"
            - 'ruby -rsocket'
    condition: selection_reverse_shell or selection_b64_pipe or selection_eval_exec
falsepositives:
    - System administrators using legitimate reverse tunnels for maintenance
    - Build systems that encode artifacts in base64
    - Container orchestration scripts
level: high
