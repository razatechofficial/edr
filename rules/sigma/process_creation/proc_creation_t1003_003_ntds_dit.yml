title: NTDS.dit Active Directory Database Extraction
id: ab3f56c9-0ef1-4acd-de45-fec1face0c23
status: experimental
description: Detects attempts to extract the NTDS.dit file which contains Active Directory password hashes, using tools like ntdsutil, vssadmin shadow copies, or direct file copy methods.
references:
    - https://attack.mitre.org/techniques/T1003/003/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.credential_access
    - attack.t1003.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_ntdsutil:
        Image|endswith: '\ntdsutil.exe'
        CommandLine|contains:
            - 'ifm'
            - 'create full'
            - 'ac i ntds'
            - 'activate instance ntds'
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains:
            - 'create shadow'
    selection_copy_ntds:
        CommandLine|contains:
            - 'ntds.dit'
            - 'NTDS.DIT'
    selection_copy_command:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\robocopy.exe'
            - '\xcopy.exe'
            - '\esentutl.exe'
        CommandLine|contains:
            - 'ntds.dit'
    selection_secretsdump:
        CommandLine|contains:
            - 'secretsdump'
            - '-ntds'
            - 'ntds_dump'
    condition: selection_ntdsutil or selection_vssadmin or selection_copy_ntds or selection_copy_command or selection_secretsdump
falsepositives:
    - Legitimate Active Directory backup procedures
    - Authorized disaster recovery operations
    - Domain controller migration tasks
level: critical
