title: Suspicious PowerShell Command Line Flags
id: a3f7b8c1-2d4e-4f6a-9b1c-3e5d7f8a0b2c
status: experimental
description: Detects PowerShell execution with suspicious flags commonly used by attackers to evade detection, hide windows, bypass execution policies, or execute encoded commands.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_exe
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_flags:
        CommandLine|contains:
            - ' -nop '
            - ' -noni '
            - ' -w hidden'
            - ' -w 1'
            - ' -windowstyle hidden'
            - ' -ep bypass'
            - ' -exec bypass'
            - ' -executionpolicy bypass'
            - ' -enc '
            - ' -encodedcommand '
            - 'downloadstring'
            - 'downloadfile'
            - 'invoke-expression'
            - ' iex '
            - '.invoke('
            - 'frombase64string'
            - 'net.webclient'
            - 'net.sockets'
            - 'reflection.assembly'
            - 'bitstransfer'
    condition: selection_image and selection_flags
falsepositives:
    - Legitimate administrative scripts using execution policy bypass
    - Software deployment tools that invoke PowerShell with hidden window
    - System management solutions like SCCM
level: medium
