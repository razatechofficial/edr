title: Signed Binary Proxy Execution via LOLBAS
id: bc4a67d0-1fa2-4bde-ef56-afd2afcb1d34
status: experimental
description: Detects abuse of signed Windows binaries (LOLBAS) to proxy execution of malicious code, bypassing application whitelisting and security controls.
references:
    - https://attack.mitre.org/techniques/T1218/
    - https://lolbas-project.github.io/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.defense_evasion
    - attack.t1218
logsource:
    category: process_creation
    product: windows
detection:
    selection_mshta:
        Image|endswith: '\mshta.exe'
        CommandLine|contains:
            - 'javascript:'
            - 'vbscript:'
            - 'http://'
            - 'https://'
            - '.hta'
            - 'about:blank'
    selection_regsvr32:
        Image|endswith: '\regsvr32.exe'
        CommandLine|contains:
            - '/s /n /u /i:'
            - '/i:http'
            - '/i:https'
            - '/i:ftp'
            - 'scrobj.dll'
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-urlcache'
            - '-decode'
            - '-decodehex'
            - '-encode'
            - '-verifyctl'
            - 'http://'
            - 'https://'
    selection_cmstp:
        Image|endswith: '\cmstp.exe'
        CommandLine|contains:
            - '/s'
            - '/ni'
    selection_msdt:
        Image|endswith: '\msdt.exe'
        CommandLine|contains:
            - 'PCWDiagnostic'
            - 'ms-msdt:'
    condition: selection_mshta or selection_regsvr32 or selection_certutil or selection_cmstp or selection_msdt
falsepositives:
    - Legitimate certificate operations using certutil
    - Software installations using regsvr32 to register DLLs
    - Help desk using msdt for diagnostics
level: high
