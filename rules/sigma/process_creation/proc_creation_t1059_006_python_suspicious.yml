title: Suspicious Python Execution Patterns
id: a9d3b4c7-8eaf-4ac1-d273-9ebf4b6a8c0d
status: experimental
description: Detects Python processes executing inline commands or spawning suspicious subprocesses, commonly used in post-exploitation toolkits and reverse shells.
references:
    - https://attack.mitre.org/techniques/T1059/006/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1059.006
logsource:
    category: process_creation
    product: linux
detection:
    selection_python:
        Image|endswith:
            - '/python'
            - '/python2'
            - '/python3'
            - '/python3.8'
            - '/python3.9'
            - '/python3.10'
            - '/python3.11'
            - '/python3.12'
    selection_inline:
        CommandLine|contains:
            - ' -c "import'
            - " -c 'import"
            - ' -c "exec('
            - " -c 'exec("
            - ' -c "eval('
            - " -c 'eval("
    selection_suspicious_imports:
        CommandLine|contains:
            - 'import socket'
            - 'import subprocess'
            - 'import pty'
            - 'import os;os.system'
            - 'import os;os.popen'
            - '__import__('
            - 'spawn("/bin'
            - "spawn('/bin"
            - 'os.dup2'
            - 'pty.spawn'
    condition: selection_python and (selection_inline or selection_suspicious_imports)
falsepositives:
    - Development and testing environments
    - Automation scripts using Python for system management
    - CI/CD pipelines
level: medium
