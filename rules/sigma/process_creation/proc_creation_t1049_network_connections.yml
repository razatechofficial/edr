title: Network Connection Enumeration
id: bc6a8d92-3fb4-4ade-ef78-abc9abde3d56
status: experimental
description: Detects execution of commands used to enumerate active network connections and listening ports, commonly performed during lateral movement reconnaissance.
references:
    - https://attack.mitre.org/techniques/T1049/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.discovery
    - attack.t1049
logsource:
    category: process_creation
    product: windows
detection:
    selection_netstat:
        Image|endswith:
            - '\netstat.exe'
            - '/netstat'
        CommandLine|contains:
            - '-ano'
            - '-an'
            - '-a'
            - '-nao'
            - '-naob'
            - '-tulnp'
            - '-tunlp'
    selection_powershell_net:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Get-NetTCPConnection'
            - 'Get-NetUDPEndpoint'
            - 'Test-NetConnection'
    selection_linux:
        Image|endswith:
            - '/ss'
            - '/lsof'
        CommandLine|contains:
            - 'ss -'
            - 'lsof -i'
            - 'lsof -P'
    selection_net_session:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains:
            - 'session'
            - 'use'
    condition: selection_netstat or selection_powershell_net or selection_linux or selection_net_session
falsepositives:
    - Network monitoring and troubleshooting
    - System administrators checking service availability
    - Network security scanning tools
level: low
