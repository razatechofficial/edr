title: Ransomware Indicators - Data Encryption
id: cd3b5e69-0ac6-4bfa-ab45-bcd6bcde0e23
status: experimental
description: Detects execution of commands commonly associated with ransomware operations including volume shadow copy deletion, boot configuration modification, and mass encryption utilities.
references:
    - https://attack.mitre.org/techniques/T1486/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.impact
    - attack.t1486
logsource:
    category: process_creation
    product: windows
detection:
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains:
            - 'delete shadows'
            - 'resize shadowstorage'
    selection_wmic_shadow:
        Image|endswith: '\wmic.exe'
        CommandLine|contains:
            - 'shadowcopy delete'
            - 'shadowcopy list'
    selection_bcdedit:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains:
            - 'recoveryenabled no'
            - 'bootstatuspolicy ignoreallfailures'
            - 'safeboot'
    selection_cipher:
        Image|endswith: '\cipher.exe'
        CommandLine|contains: '/w:'
    selection_wbadmin:
        Image|endswith: '\wbadmin.exe'
        CommandLine|contains:
            - 'delete catalog'
            - 'delete systemstatebackup'
            - 'delete backup'
    selection_powershell_shadow:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - 'Get-WmiObject Win32_ShadowCopy'
            - 'Win32_ShadowCopy'
            - '.Delete()'
    condition: selection_vssadmin or selection_wmic_shadow or selection_bcdedit or selection_cipher or selection_wbadmin or selection_powershell_shadow
falsepositives:
    - Legitimate backup management operations
    - System administrators managing VSS storage
    - Boot configuration changes during OS upgrades
level: critical
