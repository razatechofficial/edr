title: PowerShell Base64 Encoded Command Execution
id: c5f9d0e3-4a6b-4c8d-9e3f-5a7b0d2c4e6f
status: experimental
description: Detects PowerShell execution with base64 encoded commands. Attackers frequently encode malicious commands in base64 to bypass command-line based detection and obfuscate intent.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://attack.mitre.org/techniques/T1027/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1027
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_encoded:
        CommandLine|contains:
            - ' -e '
            - ' -en '
            - ' -enc '
            - ' -enco '
            - ' -encod '
            - ' -encode '
            - ' -encoded '
            - ' -encodedc '
            - ' -encodedco '
            - ' -encodedcom '
            - ' -encodedcomm '
            - ' -encodedcomma '
            - ' -encodedcomman '
            - ' -encodedcommand '
    filter_short_flag:
        CommandLine|re: '\s-e\s+[a-zA-Z]'
    selection_long_b64:
        CommandLine|re: '[A-Za-z0-9+/=]{100,}'
    condition: (selection_image and selection_encoded) or (selection_image and selection_long_b64)
falsepositives:
    - Legitimate administrative automation using encoded commands for special character handling
    - Configuration management tools encoding complex scripts
level: high
