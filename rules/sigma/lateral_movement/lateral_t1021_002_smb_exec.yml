title: SMB-Based Remote Execution
id: d6f0a4b3-5c8e-4a2d-bf4b-3e7c9d5a2b01
status: experimental
description: Detects remote command execution via SMB using tools like PsExec, smbexec, or manual SMB share access to deploy and execute payloads on remote systems.
references:
    - https://attack.mitre.org/techniques/T1021/002/
    - https://attack.mitre.org/techniques/T1570/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.lateral_movement
    - attack.t1021.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_psexec:
        Image|endswith: '\PSEXESVC.exe'
    selection_psexec_cmd:
        CommandLine|contains:
            - 'psexec'
            - 'PsExec64'
        CommandLine|contains:
            - '\\\\'
            - ' -s '
            - ' -d '
            - ' -c '
    selection_smb_tools:
        CommandLine|contains:
            - 'smbexec'
            - 'atexec'
            - 'smbclient'
            - 'Invoke-SMBExec'
            - 'Invoke-PsExec'
    selection_remote_service:
        EventID: 7045
        ServiceFileName|contains:
            - 'ADMIN$'
            - 'C$'
            - '\\\\127.0.0.1'
    selection_named_pipe:
        ParentImage|endswith: '\services.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
        ParentCommandLine|contains: 'PSEXESVC'
    condition: selection_psexec or selection_psexec_cmd or selection_smb_tools or selection_remote_service or selection_named_pipe
falsepositives:
    - Legitimate use of PsExec by system administrators
    - Software deployment tools using SMB shares
    - Automated patching solutions
level: high
