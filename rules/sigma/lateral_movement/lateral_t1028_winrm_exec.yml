title: WinRM Remote Command Execution
id: d6f0a4b3-5c8e-4a2d-bf4b-3e7c9d5a2b04
status: experimental
description: Detects remote command execution via Windows Remote Management (WinRM/PSRemoting), which attackers leverage for fileless lateral movement by executing PowerShell commands on remote systems.
references:
    - https://attack.mitre.org/techniques/T1021/006/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.lateral_movement
    - attack.t1021.006
logsource:
    category: process_creation
    product: windows
detection:
    selection_winrs:
        Image|endswith: '\winrs.exe'
        CommandLine|contains: '-r:'
    selection_psremoting:
        CommandLine|contains:
            - 'Invoke-Command -ComputerName'
            - 'Enter-PSSession -ComputerName'
            - 'New-PSSession -ComputerName'
            - 'Invoke-Command -Session'
            - 'Enable-PSRemoting'
            - 'Enable-WSManCredSSP'
    selection_wsmprovhost:
        ParentImage|endswith: '\wsmprovhost.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_winrm_service:
        CommandLine|contains:
            - 'winrm'
            - 'Set-WSManInstance'
            - 'Connect-WSMan'
        CommandLine|contains:
            - 'quickconfig'
            - 'set winrm'
            - '-Remote'
    selection_evil_winrm:
        CommandLine|contains:
            - 'evil-winrm'
            - 'Evil-WinRM'
    condition: selection_winrs or selection_psremoting or selection_wsmprovhost or selection_winrm_service or selection_evil_winrm
falsepositives:
    - Legitimate PowerShell remoting by IT administrators
    - Configuration management tools using WinRM (Ansible for Windows)
    - Automated deployment scripts
level: high
