title: Bootkit and Bootloader Modification
id: 9a0b1c2d-3e4f-4a5b-6c7d-8e9f0a1b2c3d
status: experimental
description: Detects attempts to modify boot records, bootloader configuration, or firmware that indicate bootkit installation for persistence below the OS
references:
    - https://attack.mitre.org/techniques/T1542/003/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.defense_evasion
    - attack.t1542.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_bcdedit:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains:
            - '/set'
            - '/create'
            - '/delete'
            - '/import'
            - 'bootstatuspolicy ignoreallfailures'
            - 'recoveryenabled No'
            - 'testsigning on'
            - 'nointegritychecks'
            - 'loadoptions DISABLE_INTEGRITY_CHECKS'
    selection_bootrec:
        Image|endswith:
            - '\bootrec.exe'
            - '\bootsect.exe'
        CommandLine|contains:
            - '/fixmbr'
            - '/fixboot'
            - '/rebuildbcd'
            - '/nt60'
    selection_raw_disk:
        CommandLine|contains:
            - '\\\\.\PhysicalDrive0'
            - '\\\\.\PhysicalDisk0'
            - 'dd if='
            - 'CreateFile'
        CommandLine|contains:
            - 'MBR'
            - 'boot'
            - 'sector'
    condition: selection_bcdedit or selection_bootrec or selection_raw_disk
falsepositives:
    - System recovery operations
    - Dual-boot configuration changes
    - Legitimate boot configuration by administrators
level: critical
---
title: Bootloader Modification on Linux
id: 9a0b1c2d-3e4f-4a5b-6c7d-8e9f0a1b2c3e
status: experimental
description: Detects modification of GRUB or other bootloader configurations on Linux
references:
    - https://attack.mitre.org/techniques/T1542/003/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.t1542.003
logsource:
    category: process_creation
    product: linux
detection:
    selection_grub:
        CommandLine|contains:
            - 'grub-install'
            - 'grub2-install'
            - 'update-grub'
            - 'grub-mkconfig'
            - 'grub2-mkconfig'
    selection_dd:
        CommandLine|contains:
            - 'dd if='
        CommandLine|contains:
            - 'of=/dev/sda'
            - 'of=/dev/nvme'
            - 'of=/dev/vda'
            - 'bs=512 count=1'
    selection_efi:
        CommandLine|contains:
            - 'efibootmgr'
            - '/boot/efi'
            - 'mokutil'
    condition: selection_grub or selection_dd or selection_efi
falsepositives:
    - Kernel and bootloader updates
    - Dual-boot system configuration
level: high
