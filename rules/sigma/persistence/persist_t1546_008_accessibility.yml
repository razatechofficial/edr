title: Accessibility Features Backdoor
id: 5c6d7e8f-9a0b-4c1d-2e3f-4a5b6c7d8e9f
status: experimental
description: Detects replacement or modification of Windows accessibility tools (sethc, utilman, osk, narrator, magnify) commonly abused for pre-authentication backdoor access
references:
    - https://attack.mitre.org/techniques/T1546/008/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1546.008
logsource:
    category: process_creation
    product: windows
detection:
    selection_ifeo:
        CommandLine|contains:
            - 'reg add'
            - 'Set-ItemProperty'
        CommandLine|contains:
            - 'Image File Execution Options'
        CommandLine|contains:
            - 'sethc.exe'
            - 'utilman.exe'
            - 'osk.exe'
            - 'Narrator.exe'
            - 'Magnify.exe'
            - 'DisplaySwitch.exe'
            - 'AtBroker.exe'
    selection_copy:
        CommandLine|contains:
            - 'copy '
            - 'move '
            - 'ren '
            - 'Copy-Item'
            - 'Move-Item'
        CommandLine|contains:
            - 'sethc.exe'
            - 'utilman.exe'
            - 'osk.exe'
            - 'Narrator.exe'
            - 'Magnify.exe'
    selection_debugger:
        CommandLine|contains:
            - 'Debugger'
            - 'cmd.exe'
            - 'powershell.exe'
        CommandLine|contains:
            - 'sethc'
            - 'utilman'
    condition: selection_ifeo or selection_copy or selection_debugger
falsepositives:
    - Legitimate accessibility tool updates via Windows Update
level: critical
