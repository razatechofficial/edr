title: Local Account Creation for Persistence
id: 2f3a4b5c-6d7e-4f8a-9b0c-1d2e3f4a5b6c
status: experimental
description: Detects creation of local user accounts which may be used to establish persistent access
references:
    - https://attack.mitre.org/techniques/T1136/001/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_net:
        CommandLine|contains:
            - 'net user /add'
            - 'net1 user /add'
            - 'net user'
        CommandLine|contains:
            - '/add'
    selection_powershell:
        CommandLine|contains:
            - 'New-LocalUser'
            - 'New-ADUser'
    selection_wmic:
        CommandLine|contains: 'wmic useraccount'
        CommandLine|contains: 'create'
    selection_admin_add:
        CommandLine|contains:
            - 'net localgroup administrators'
            - 'net localgroup "Remote Desktop Users"'
        CommandLine|contains: '/add'
    condition: selection_net or selection_powershell or selection_wmic or selection_admin_add
falsepositives:
    - Help desk or IT creating legitimate accounts
    - Automated provisioning systems
level: high
---
title: Local Account Creation on Linux/macOS
id: 2f3a4b5c-6d7e-4f8a-9b0c-1d2e3f4a5b6d
status: experimental
description: Detects creation of local user accounts on Unix systems for persistence
references:
    - https://attack.mitre.org/techniques/T1136/001/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith:
            - '/useradd'
            - '/adduser'
            - '/usermod'
            - '/dscl'
        CommandLine|contains:
            - 'useradd'
            - 'adduser'
            - 'dscl . -create /Users/'
    selection_group_add:
        CommandLine|contains:
            - 'usermod -aG sudo'
            - 'usermod -aG wheel'
            - 'usermod -aG root'
            - 'gpasswd -a'
    condition: selection or selection_group_add
falsepositives:
    - Standard user provisioning
    - Configuration management tools
level: high
