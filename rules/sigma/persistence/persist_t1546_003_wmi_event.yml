title: WMI Event Subscription Persistence
id: 4b5c6d7e-8f9a-4b0c-1d2e-3f4a5b6c7d8e
status: experimental
description: Detects creation of WMI event subscriptions used for persistence, including EventFilter, EventConsumer, and FilterToConsumerBinding
references:
    - https://attack.mitre.org/techniques/T1546/003/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1546.003
logsource:
    category: process_creation
    product: windows
detection:
    selection_wmic:
        CommandLine|contains:
            - 'wmic /namespace:\\\\root\\subscription'
            - '__EventFilter'
            - '__EventConsumer'
            - '__FilterToConsumerBinding'
            - 'CommandLineEventConsumer'
            - 'ActiveScriptEventConsumer'
    selection_powershell:
        CommandLine|contains:
            - 'Set-WmiInstance'
            - 'New-CimInstance'
            - 'Register-WmiEvent'
            - 'Register-CimIndicationEvent'
        CommandLine|contains:
            - 'EventFilter'
            - 'EventConsumer'
            - 'FilterToConsumerBinding'
            - 'root\\subscription'
            - 'root/subscription'
    selection_mof:
        CommandLine|contains:
            - 'mofcomp'
        CommandLine|endswith:
            - '.mof'
    condition: selection_wmic or selection_powershell or selection_mof
falsepositives:
    - Legitimate system management tools creating WMI event subscriptions
    - SCCM client operations
level: high
