title: SAM or SECURITY Hive Access
id: win-sam-hive-access-001
status: stable
description: Detects reg save or access patterns targeting SAM/SECURITY hives
tags:
  - attack.credential_access
  - attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'reg save hklm\sam'
      - 'reg save hklm\security'
      - 'HKLM\\SAM'
      - 'HKLM\\SECURITY'
      - '\Windows\System32\config\SAM'
      - '\Windows\System32\config\SECURITY'
  condition: selection
level: high
