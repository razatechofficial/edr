title: Unsecured Credential File Access
id: 9d1e3f57-b8c0-4324-a659-4a2e7b9c3d86
status: experimental
description: Detects access to files commonly containing credentials such as SSH keys, cloud provider configs, and password stores
references:
    - https://attack.mitre.org/techniques/T1552/001/
    - https://attack.mitre.org/techniques/T1552/004/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.credential_access
    - attack.t1552.001
    - attack.t1552.004
logsource:
    category: file_access
    product: linux
detection:
    selection_ssh:
        TargetFilename|contains:
            - '/.ssh/id_rsa'
            - '/.ssh/id_ed25519'
            - '/.ssh/id_ecdsa'
            - '/.ssh/id_dsa'
            - '/.ssh/authorized_keys'
            - '/.ssh/known_hosts'
    selection_cloud:
        TargetFilename|contains:
            - '/.aws/credentials'
            - '/.aws/config'
            - '/.azure/accessTokens.json'
            - '/.config/gcloud/credentials.db'
            - '/.config/gcloud/application_default_credentials.json'
            - '/.kube/config'
    selection_other:
        TargetFilename|contains:
            - '/.gnupg/secring.gpg'
            - '/.netrc'
            - '/.git-credentials'
            - '/.pgpass'
            - '/.my.cnf'
    condition: selection_ssh or selection_cloud or selection_other
falsepositives:
    - Legitimate SSH connections
    - Cloud CLI tools used by administrators
    - Backup and configuration management tools
level: medium
