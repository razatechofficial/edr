title: Suspicious LNK File Creation
id: e7f1b3c5-2d48-4a96-b739-1c5e8f6a2d09
status: experimental
description: Detects creation of suspicious shortcut (LNK) files that may be used for persistence or initial access
references:
    - https://attack.mitre.org/techniques/T1547/009/
    - https://attack.mitre.org/techniques/T1204/001/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.persistence
    - attack.t1547.009
    - attack.execution
    - attack.t1204.001
logsource:
    category: file_event
    product: windows
detection:
    selection_lnk:
        TargetFilename|endswith: '.lnk'
    selection_suspicious_location:
        TargetFilename|contains:
            - '\Desktop\'
            - '\Downloads\'
            - '\Temp\'
            - '\Users\Public\'
    filter_normal:
        SourceFilename|contains:
            - '\explorer.exe'
            - '\shell32.dll'
    condition: selection_lnk and selection_suspicious_location and not filter_normal
falsepositives:
    - Legitimate shortcuts created by software installers
    - User-created shortcuts
level: medium
