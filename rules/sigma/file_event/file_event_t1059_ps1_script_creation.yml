title: PowerShell Script Created in Temp or Downloads
id: 1b3c5d7e-8f2a-4916-b4d3-6e9a0c2f1875
status: experimental
description: Detects creation of PowerShell script files in temporary or download directories
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: file_event
    product: windows
detection:
    selection_ext:
        TargetFilename|endswith:
            - '.ps1'
            - '.psm1'
            - '.psd1'
    selection_path:
        TargetFilename|contains:
            - '\Temp\'
            - '\Downloads\'
            - '\AppData\Local\Temp\'
            - '\Users\Public\'
            - '\ProgramData\'
    condition: selection_ext and selection_path
falsepositives:
    - Legitimate PowerShell scripts downloaded for administration
    - Configuration management tools
level: medium
