title: Container Escape Attempts
id: e5f6a7b8-c9d0-4e1f-2a3b-4c5d6e7f8a9c
status: experimental
description: Detects commands and techniques commonly used to escape container isolation and gain host-level access
references:
    - https://attack.mitre.org/techniques/T1611/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.privilege_escalation
    - attack.t1611
logsource:
    category: process_creation
    product: linux
detection:
    selection_cgroup_escape:
        CommandLine|contains:
            - 'release_agent'
            - 'notify_on_release'
            - '/sys/fs/cgroup'
            - 'cgroup'
        CommandLine|contains:
            - 'echo'
            - 'cat'
            - 'mount'
    selection_docker_sock:
        CommandLine|contains:
            - '/var/run/docker.sock'
            - 'docker.sock'
            - 'curl --unix-socket'
    selection_nsenter:
        CommandLine|contains:
            - 'nsenter'
            - '--target 1'
            - '--mount'
            - '--pid'
            - '--net'
    selection_mount_escape:
        CommandLine|contains:
            - 'mount /dev/'
            - 'mount -o bind'
            - 'debugfs'
        CommandLine|contains:
            - '/host'
            - '/mnt'
    selection_capabilities:
        CommandLine|contains:
            - 'capsh --print'
            - 'cat /proc/1/status'
            - 'cat /proc/self/status'
            - 'fdisk -l'
            - 'cat /proc/1/cgroup'
    condition: selection_cgroup_escape or selection_docker_sock or selection_nsenter or selection_mount_escape or selection_capabilities
falsepositives:
    - Container management and debugging by DevOps
    - Legitimate use of nsenter for container inspection
level: critical
