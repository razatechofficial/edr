title: Sudo Caching Abuse
id: f6a7b8c9-d0e1-4f2a-3b4c-5d6e7f8a9b0d
status: experimental
description: Detects manipulation of sudo caching mechanisms, timestamp files, or sudoers configuration to escalate privileges
references:
    - https://attack.mitre.org/techniques/T1548/003/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.privilege_escalation
    - attack.defense_evasion
    - attack.t1548.003
logsource:
    category: process_creation
    product: linux
detection:
    selection_sudoers:
        CommandLine|contains:
            - 'visudo'
            - 'echo'
            - 'tee'
        CommandLine|contains:
            - '/etc/sudoers'
            - '/etc/sudoers.d/'
            - 'NOPASSWD'
            - 'ALL=(ALL)'
    selection_timestamp:
        CommandLine|contains:
            - '/var/db/sudo'
            - '/var/run/sudo/ts'
            - 'sudo -k'
            - 'sudo -K'
    selection_sudo_exploit:
        CommandLine|contains:
            - 'sudo -u#-1'
            - 'sudo -u #-1'
            - 'CVE-2019-14287'
            - 'CVE-2021-3156'
            - 'sudoedit'
            - 'sudo --preserve-env'
    selection_sudo_token_reuse:
        CommandLine|contains:
            - 'ptrace'
            - 'PTRACE_ATTACH'
            - '/proc/'
            - 'gdb -p'
        CommandLine|contains:
            - 'sudo'
    condition: selection_sudoers or selection_timestamp or selection_sudo_exploit or selection_sudo_token_reuse
falsepositives:
    - System administrators modifying sudoers for legitimate access control
    - Automated configuration management
level: high
