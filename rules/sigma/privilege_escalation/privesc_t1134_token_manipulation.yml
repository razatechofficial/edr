title: Access Token Manipulation
id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5e
status: experimental
description: Detects attempts to manipulate access tokens for privilege escalation, including token impersonation, duplication, and creation
references:
    - https://attack.mitre.org/techniques/T1134/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.privilege_escalation
    - attack.defense_evasion
    - attack.t1134
logsource:
    category: process_creation
    product: windows
detection:
    selection_runas:
        Image|endswith: '\runas.exe'
        CommandLine|contains:
            - '/netonly'
            - '/savecred'
            - '/user:administrator'
            - '/user:system'
    selection_token_tools:
        CommandLine|contains:
            - 'Invoke-TokenManipulation'
            - 'Invoke-Impersonation'
            - 'ImpersonateLoggedOnUser'
            - 'DuplicateTokenEx'
            - 'SetThreadToken'
            - 'CreateProcessWithTokenW'
            - 'CreateProcessAsUser'
            - 'AdjustTokenPrivileges'
    selection_potato:
        CommandLine|contains:
            - 'JuicyPotato'
            - 'RottenPotato'
            - 'SweetPotato'
            - 'PrintSpoofer'
            - 'GodPotato'
            - 'SharpToken'
            - 'incognito'
    selection_whoami_priv:
        CommandLine|contains:
            - 'whoami /priv'
            - 'SeImpersonatePrivilege'
            - 'SeAssignPrimaryTokenPrivilege'
            - 'SeDebugPrivilege'
    condition: selection_runas or selection_token_tools or selection_potato or selection_whoami_priv
falsepositives:
    - Legitimate use of runas for administrative tasks
    - Application compatibility requiring token manipulation
level: high
