title: Service Permission Weakness Exploitation
id: d4e5f6a7-b8c9-4d0e-1f2a-3b4c5d6e7f8b
status: experimental
description: Detects modification of Windows service configurations that may indicate exploitation of weak service permissions for privilege escalation
references:
    - https://attack.mitre.org/techniques/T1574/010/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.privilege_escalation
    - attack.persistence
    - attack.t1574.010
logsource:
    category: process_creation
    product: windows
detection:
    selection_sc_config:
        Image|endswith: '\sc.exe'
        CommandLine|contains:
            - 'config'
            - 'sdset'
        CommandLine|contains:
            - 'binpath='
            - 'binPath='
            - 'obj='
            - 'start='
    selection_service_hijack:
        Image|endswith: '\sc.exe'
        CommandLine|contains:
            - 'binpath= "cmd'
            - 'binpath= "powershell'
            - 'binpath= cmd'
            - 'binpath= powershell'
            - 'binpath= "C:\Temp'
            - 'binpath= "C:\Users'
    selection_accesschk:
        CommandLine|contains:
            - 'accesschk'
            - 'icacls'
        CommandLine|contains:
            - 'SERVICE_ALL_ACCESS'
            - 'SERVICE_CHANGE_CONFIG'
            - 'WRITE_DAC'
            - '/grant'
    selection_tools:
        CommandLine|contains:
            - 'PowerUp'
            - 'Get-ModifiableService'
            - 'Get-ServiceUnquoted'
            - 'Invoke-ServiceAbuse'
            - 'Write-ServiceBinary'
    condition: selection_sc_config or selection_service_hijack or selection_accesschk or selection_tools
falsepositives:
    - Legitimate service configuration by administrators
    - Software installation changing service binaries
level: high
