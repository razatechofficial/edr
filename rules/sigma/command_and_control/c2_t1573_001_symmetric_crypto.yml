title: Symmetric Encryption for C2 Communication
id: d6e7f8a9-b0c1-4d2e-3f4a-5b6c7d8e9f0b
status: experimental
description: Detects use of symmetric encryption libraries and tools in the context of network communication, indicating encrypted C2 channels
references:
    - https://attack.mitre.org/techniques/T1573/001/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.command_and_control
    - attack.t1573.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_crypto_api:
        CommandLine|contains:
            - 'AesCryptoServiceProvider'
            - 'RijndaelManaged'
            - 'DESCryptoServiceProvider'
            - 'RC4'
            - 'TripleDES'
            - 'System.Security.Cryptography'
            - 'CryptoStream'
            - 'ICryptoTransform'
    selection_network:
        CommandLine|contains:
            - 'Net.Sockets'
            - 'TcpClient'
            - 'Net.WebClient'
            - 'WebRequest'
            - 'Socket'
            - 'StreamReader'
            - 'StreamWriter'
    selection_openssl:
        CommandLine|contains:
            - 'openssl enc'
            - 'openssl aes'
            - 'openssl des'
            - 'openssl bf'
            - 'openssl rc4'
    selection_known_c2:
        CommandLine|contains:
            - 'Invoke-Empire'
            - 'Invoke-Covenant'
            - 'Invoke-Merlin'
            - 'Invoke-PoshC2'
    condition: (selection_crypto_api and selection_network) or selection_openssl or selection_known_c2
falsepositives:
    - Legitimate applications using encrypted network communication
    - Security tools testing encrypted channels
    - Development and testing of crypto libraries
level: high
