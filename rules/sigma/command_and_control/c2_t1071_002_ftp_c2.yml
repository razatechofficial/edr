title: FTP-Based Command and Control
id: d0e1f2a3-b4c5-4d6e-7f8a-9b0c1d2e3f4b
status: experimental
description: Detects suspicious FTP activity that may indicate FTP-based command and control communication
references:
    - https://attack.mitre.org/techniques/T1071/002/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.command_and_control
    - attack.t1071.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_ftp_binary:
        Image|endswith:
            - '\ftp.exe'
    selection_ftp_script:
        CommandLine|contains:
            - 'ftp -s:'
            - 'ftp.exe -s:'
            - 'open '
            - 'binary'
            - 'put '
            - 'get '
    selection_powershell_ftp:
        CommandLine|contains:
            - 'Net.WebClient'
            - 'FtpWebRequest'
            - 'ftp://'
    selection_winscp:
        CommandLine|contains:
            - 'WinSCP.com'
            - 'winscp.exe'
            - '/script:'
            - '/command'
        CommandLine|contains:
            - 'ftp://'
            - 'sftp://'
    filter_known:
        ParentImage|endswith:
            - '\explorer.exe'
            - '\FileZilla.exe'
    condition: (selection_ftp_binary and selection_ftp_script) or selection_powershell_ftp or (selection_winscp and not filter_known)
falsepositives:
    - Legitimate FTP file transfers
    - Automated backup scripts using FTP
    - Web development deployments
level: medium
