title: C2 Data Encoding Patterns
id: f2a3b4c5-d6e7-4f8a-9b0c-1d2e3f4a5b6d
status: experimental
description: Detects use of encoding techniques commonly employed to obfuscate C2 communications, including Base64, hex encoding, and XOR operations
references:
    - https://attack.mitre.org/techniques/T1132/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.command_and_control
    - attack.t1132
logsource:
    category: process_creation
    product: windows
detection:
    selection_base64:
        CommandLine|contains:
            - '-EncodedCommand'
            - '-enc '
            - '-e '
            - '-ec '
            - 'FromBase64String'
            - 'ToBase64String'
            - '[Convert]::FromBase64String'
            - '[Convert]::ToBase64String'
    selection_certutil_encode:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-encode'
            - '-decode'
            - '-decodehex'
    selection_powershell_encode:
        CommandLine|contains:
            - 'System.Text.Encoding'
            - 'UTF8.GetString'
            - 'Unicode.GetString'
            - 'ASCII.GetString'
            - '-bxor'
            - 'Xor'
    selection_network_context:
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'Net.WebClient'
            - 'Invoke-WebRequest'
            - 'DownloadString'
    condition: (selection_base64 or selection_certutil_encode or selection_powershell_encode) and selection_network_context
falsepositives:
    - Legitimate scripts encoding data for API transmission
    - Certificate management operations
level: high
