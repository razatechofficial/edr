title: HTTP Beacon Pattern Detection
id: c9d0e1f2-a3b4-4c5d-6e7f-8a9b0c1d2e3a
status: experimental
description: Detects processes making regular-interval HTTP requests characteristic of C2 beaconing, including common beacon frameworks and suspicious user agents
references:
    - https://attack.mitre.org/techniques/T1071/001/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_beacon_tools:
        CommandLine|contains:
            - 'Invoke-WebRequest'
            - 'wget'
            - 'curl'
            - 'Net.WebClient'
            - 'DownloadString'
            - 'DownloadData'
            - 'Start-BitsTransfer'
            - 'Invoke-RestMethod'
            - 'WebRequest'
    selection_suspicious_urls:
        CommandLine|contains:
            - '/beacon'
            - '/pixel'
            - '/updates'
            - '/news'
            - '/feed'
            - '/api/v1'
            - '/submit'
            - '/gate'
            - '/panel'
            - '/login.php'
            - '/index.php'
            - '/admin.php'
            - 'pastebin.com'
            - 'paste.ee'
            - 'hastebin.com'
    selection_loop:
        CommandLine|contains:
            - 'while($true)'
            - 'while(1)'
            - 'Start-Sleep'
            - 'sleep'
        CommandLine|contains:
            - 'http://'
            - 'https://'
    condition: (selection_beacon_tools and selection_suspicious_urls) or selection_loop
falsepositives:
    - Legitimate scripts polling APIs at regular intervals
    - Health check monitoring scripts
    - Scheduled data synchronization
level: medium
