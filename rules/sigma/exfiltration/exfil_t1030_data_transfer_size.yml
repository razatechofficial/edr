title: Suspicious Large Data Transfer or Staging
id: e7a1b5c4-6d9f-4b3e-af5c-4e8d0a6b3c05
status: experimental
description: Detects suspicious data staging and compression activities that precede exfiltration, including archiving large amounts of data, compressing sensitive directories, or splitting files for transfer.
references:
    - https://attack.mitre.org/techniques/T1030/
    - https://attack.mitre.org/techniques/T1074/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.exfiltration
    - attack.t1030
    - attack.collection
    - attack.t1074
logsource:
    category: process_creation
detection:
    selection_archive_sensitive:
        Image|endswith:
            - '\7z.exe'
            - '\rar.exe'
            - '\zip.exe'
            - '\tar.exe'
            - '/tar'
            - '/gzip'
            - '/bzip2'
        CommandLine|contains:
            - '\Users\\'
            - '\Documents\\'
            - '\Desktop\\'
            - '\Downloads\\'
            - '/home/'
            - '/etc/'
            - 'C:\\Windows\\System32\\'
    selection_powershell_compress:
        CommandLine|contains:
            - 'Compress-Archive'
            - 'ZipFile'
            - '[System.IO.Compression'
        CommandLine|contains:
            - 'Documents'
            - 'Desktop'
            - 'Users'
            - 'Database'
    selection_split_files:
        CommandLine|contains:
            - 'split -b'
            - 'split --bytes'
            - 'fsutil file createnew'
            - 'makecab'
    selection_rar_password:
        Image|endswith:
            - '\rar.exe'
            - '\7z.exe'
        CommandLine|contains:
            - ' -hp'
            - ' -p'
            - ' a '
        CommandLine|contains:
            - '.rar'
            - '.7z'
            - '.zip'
    condition: selection_archive_sensitive or selection_powershell_compress or selection_split_files or selection_rar_password
falsepositives:
    - Legitimate backup and archival operations
    - Developers creating project archives
    - File compression for email attachments
    - System migration activities
level: medium
