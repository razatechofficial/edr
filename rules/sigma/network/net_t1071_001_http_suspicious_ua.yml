title: Suspicious HTTP User Agent - Known RAT/Malware
id: a1b2c3d4-e5f6-4789-a012-b3c4d5e6f7a8
status: experimental
description: Detects HTTP connections with user agent strings associated with known RATs, malware frameworks, or penetration testing tools
references:
    - https://attack.mitre.org/techniques/T1071/001/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        HttpUserAgent|contains:
            - 'CobaltStrike'
            - 'Cobalt Strike'
            - 'Meterpreter'
            - 'Metasploit'
            - 'Empire'
            - 'PoshC2'
            - 'Covenant'
            - 'Sliver'
            - 'Havoc'
            - 'Brute Ratel'
            - 'YOURMALWARE'
            - 'Mozilla/4.0 (compatible; MSIE 6.0;)'
            - 'Mozilla/5.0 (Windows; U; Windows NT 5.1;'
            - 'Internet Explorer'
            - 'WinHTTP'
            - 'Python-urllib'
            - 'python-requests'
            - 'Go-http-client'
            - 'Java/'
            - 'curl/'
            - 'wget/'
            - 'HTTPie/'
            - 'lwp-trivial'
            - 'Wget'
    condition: selection
falsepositives:
    - Legitimate automation tools using these user agents
    - Development and testing environments
    - System administration scripts
level: high
