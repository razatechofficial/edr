title: Automated Periodic Data Exfiltration Pattern
id: a5b6c7d8-e9f0-4123-a456-b7c8d9e0f1a2
status: experimental
description: Detects patterns consistent with automated or periodic data exfiltration including repeated connections to uncommon cloud storage and data transfer services
references:
    - https://attack.mitre.org/techniques/T1020/
    - https://attack.mitre.org/techniques/T1567/002/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.exfiltration
    - attack.t1020
    - attack.t1567.002
logsource:
    category: network_connection
    product: windows
detection:
    selection_storage:
        DestinationHostname|contains:
            - 'storage.googleapis.com'
            - 's3.amazonaws.com'
            - 'blob.core.windows.net'
            - 'backblazeb2.com'
            - 'wasabisys.com'
    selection_upload:
        DestinationHostname|contains:
            - 'upload.'
            - 'files.'
            - 'transfer.'
            - 'send.'
    filter_trusted:
        DestinationHostname|endswith:
            - '.microsoft.com'
            - '.office.com'
            - '.windows.net'
    condition: (selection_storage or selection_upload) and not filter_trusted
falsepositives:
    - Legitimate cloud storage usage
    - Backup software
    - File synchronization services
level: low
