title: RDP Lateral Movement Connection
id: a9b0c1d2-e3f4-4567-a890-b1c2d3e4f5a6
status: experimental
description: Detects RDP connections that may indicate lateral movement within the network
references:
    - https://attack.mitre.org/techniques/T1021/001/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.lateral_movement
    - attack.t1021.001
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        DestinationPort: 3389
    filter_internal_rdp:
        DestinationIp|startswith:
            - '10.'
            - '172.16.'
            - '172.17.'
            - '172.18.'
            - '172.19.'
            - '172.20.'
            - '172.21.'
            - '172.22.'
            - '172.23.'
            - '172.24.'
            - '172.25.'
            - '172.26.'
            - '172.27.'
            - '172.28.'
            - '172.29.'
            - '172.30.'
            - '172.31.'
            - '192.168.'
    selection_external_rdp:
        DestinationPort: 3389
    condition: selection and not filter_internal_rdp
falsepositives:
    - Legitimate remote desktop to cloud servers
    - Jump box/bastion host connections
level: high
