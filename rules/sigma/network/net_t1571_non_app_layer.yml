title: Non-Application Layer Protocol Communication
id: d6e7f8a9-b0c1-4234-d567-e8f9a0b1c2d3
status: experimental
description: Detects use of non-standard or raw protocol communication that may indicate custom C2 protocols or tunneling
references:
    - https://attack.mitre.org/techniques/T1095/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.command_and_control
    - attack.t1095
logsource:
    category: network_connection
    product: windows
detection:
    selection_icmp_tunnel:
        Protocol: 'ICMP'
    selection_raw:
        DestinationPort:
            - 0
            - 4
            - 41
            - 47
            - 50
            - 51
    filter_legitimate_icmp:
        DestinationIp|startswith:
            - '10.'
            - '172.16.'
            - '192.168.'
            - '127.'
    condition: (selection_icmp_tunnel and not filter_legitimate_icmp) or selection_raw
falsepositives:
    - Network monitoring tools using ICMP
    - VPN connections using GRE (protocol 47)
    - IPSec tunnels (protocols 50, 51)
level: medium
