title: DNS TXT Record Query - Potential C2 or Data Exfiltration
id: c3d4e5f6-a7b8-4901-c234-d5e6f7a8b9c0
status: experimental
description: Detects DNS TXT record queries that may indicate command and control communication or data exfiltration via DNS
references:
    - https://attack.mitre.org/techniques/T1071/004/
    - https://attack.mitre.org/techniques/T1048/003/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.command_and_control
    - attack.t1071.004
    - attack.exfiltration
    - attack.t1048.003
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        QueryType: 'TXT'
    filter_legitimate:
        DestinationHostname|endswith:
            - '.google.com'
            - '.microsoft.com'
            - '.amazonaws.com'
            - '._dmarc.'
            - '._spf.'
            - '._domainkey.'
    condition: selection and not filter_legitimate
falsepositives:
    - SPF, DKIM, and DMARC validation queries
    - Legitimate service verification via DNS TXT
    - Let's Encrypt DNS challenges
level: medium
