title: SSH Tunneling - Dynamic Port Forwarding Pattern
id: f6a7b8c9-d0e1-4234-f567-a8b9c0d1e2f3
status: experimental
description: Detects SSH connections on non-standard ports or patterns indicative of SSH tunneling and dynamic port forwarding
references:
    - https://attack.mitre.org/techniques/T1572/
    - https://attack.mitre.org/techniques/T1021/004/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.command_and_control
    - attack.t1572
    - attack.lateral_movement
    - attack.t1021.004
logsource:
    category: network_connection
    product: windows
detection:
    selection_ssh_nonstandard:
        DestinationPort:
            - 2222
            - 8022
            - 2200
            - 443
            - 8443
    selection_ssh_standard_external:
        DestinationPort: 22
    filter_internal:
        DestinationIp|startswith:
            - '10.'
            - '172.16.'
            - '172.17.'
            - '172.18.'
            - '172.19.'
            - '172.20.'
            - '172.21.'
            - '172.22.'
            - '172.23.'
            - '172.24.'
            - '172.25.'
            - '172.26.'
            - '172.27.'
            - '172.28.'
            - '172.29.'
            - '172.30.'
            - '172.31.'
            - '192.168.'
            - '127.'
    condition: selection_ssh_nonstandard or (selection_ssh_standard_external and not filter_internal)
falsepositives:
    - Legitimate SSH connections to external servers
    - Git operations over SSH
    - Remote administration
level: medium
