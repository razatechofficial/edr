title: Service Account Interactive Logon
id: 9a3c7e12-4b5f-4d8a-a1c3-6e9f2b4d7a12
status: experimental
description: Detects interactive logon sessions using service accounts, which normally authenticate only via network or batch logon types. Interactive use of service accounts may indicate credential theft.
references:
    - https://attack.mitre.org/techniques/T1078/
    - https://docs.microsoft.com/en-us/windows-server/identity/securing-privileged-access/securing-privileged-access
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1078
logsource:
    category: authentication
    product: windows
detection:
    selection:
        EventID: 4624
        LogonType:
            - 2
            - 10
            - 11
    selection_service_accounts:
        TargetUserName|startswith:
            - 'svc_'
            - 'svc-'
            - 'service_'
            - 'service-'
            - 'sql_'
            - 'sql-'
            - 'app_'
            - 'app-'
            - 'iis_'
            - 'task_'
    selection_service_pattern:
        TargetUserName|contains:
            - 'Service'
            - 'MSSQL'
            - 'SQLAgent'
            - 'IIS_IUSRS'
            - 'IUSR'
    condition: selection and (selection_service_accounts or selection_service_pattern)
falsepositives:
    - Administrators who log in interactively with service accounts for troubleshooting
    - Poorly named user accounts that match service naming patterns
level: high
