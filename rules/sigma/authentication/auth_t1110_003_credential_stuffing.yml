title: Credential Stuffing - Rapid Authentication From Multiple Sources
id: 9a3c7e12-4b5f-4d8a-a1c3-6e9f2b4d7a06
status: experimental
description: Detects credential stuffing patterns where many different source IPs attempt authentication against a small set of accounts in rapid succession, indicating the use of leaked credential databases.
references:
    - https://attack.mitre.org/techniques/T1110/004/
    - https://owasp.org/www-community/attacks/Credential_stuffing
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.credential_access
    - attack.t1110.004
logsource:
    category: authentication
detection:
    selection_failed:
        action: 'failure'
        event_type: 'login'
    selection_success_after_fail:
        action: 'success'
        event_type: 'login'
    condition: selection_failed | count(src_ip) by user > 5
    timeframe: 15m
falsepositives:
    - Load balancers proxying authentication from multiple backend sources
    - NAT gateways where many users share IP addresses
    - Large organizations with rotating proxy infrastructure
level: high
