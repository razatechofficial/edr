title: Password Spraying - Failed Logins Across Multiple Accounts
id: 9a3c7e12-4b5f-4d8a-a1c3-6e9f2b4d7a05
status: experimental
description: Detects password spraying attacks where a single source attempts authentication against many different user accounts with few password attempts per account, evading account lockout thresholds.
references:
    - https://attack.mitre.org/techniques/T1110/003/
    - https://www.microsoft.com/security/blog/2020/04/23/protecting-organization-password-spray-attacks/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.credential_access
    - attack.t1110.003
logsource:
    category: authentication
    product: windows
detection:
    selection:
        EventID: 4625
        Status:
            - '0xC000006D'
            - '0xC000006A'
        SubStatus: '0xC000006A'
    filter_machine:
        TargetUserName|endswith: '$'
    condition: selection and not filter_machine | count(TargetUserName) by IpAddress > 15
    timeframe: 10m
falsepositives:
    - Vulnerability scanners performing authentication tests
    - Penetration testing activities
    - Misconfigured applications attempting connections with multiple accounts
level: high
