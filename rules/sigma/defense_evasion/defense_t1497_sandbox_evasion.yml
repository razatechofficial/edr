title: Sandbox and Virtual Machine Detection Attempts
id: b4d8e2f1-3a6c-4e9b-8d2f-1a5c7e3b9d13
status: experimental
description: Detects processes performing checks for virtualization artifacts, sandbox environments, or analysis tools, indicating malware attempting to evade automated analysis.
references:
    - https://attack.mitre.org/techniques/T1497/
    - https://attack.mitre.org/techniques/T1497/001/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.defense_evasion
    - attack.discovery
    - attack.t1497
    - attack.t1497.001
logsource:
    category: process_creation
detection:
    selection_vm_checks:
        CommandLine|contains:
            - 'VMwareService'
            - 'VMwareTray'
            - 'VBoxService'
            - 'VBoxTray'
            - 'vmtoolsd'
            - 'vmusrvc'
            - 'qemu-ga'
            - 'xenservice'
    selection_wmi_vm:
        CommandLine|contains:
            - 'Win32_ComputerSystem'
            - 'Model'
            - 'Manufacturer'
            - 'SerialNumber'
            - 'Win32_BIOS'
        CommandLine|contains:
            - 'Virtual'
            - 'VMware'
            - 'VirtualBox'
            - 'QEMU'
            - 'Xen'
    selection_registry_vm:
        CommandLine|contains:
            - 'HKLM\SOFTWARE\VMware'
            - 'HKLM\SOFTWARE\Oracle\VirtualBox'
            - 'HKLM\HARDWARE\ACPI\DSDT\VBOX'
            - 'HKLM\SYSTEM\CurrentControlSet\Services\VBoxSF'
    selection_sandbox_artifacts:
        CommandLine|contains:
            - 'SbieDll.dll'
            - 'dbghelp.dll'
            - 'api_log.dll'
            - 'SxIn.dll'
            - 'Sf2.dll'
            - 'cmdvrt32.dll'
            - 'snxhk.dll'
    condition: selection_vm_checks or selection_wmi_vm or selection_registry_vm or selection_sandbox_artifacts
falsepositives:
    - Legitimate system inventory tools checking hardware
    - IT asset management software
    - Hypervisor management applications
level: medium
