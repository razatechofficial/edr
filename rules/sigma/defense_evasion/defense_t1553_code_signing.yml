title: Code Signing Policy Modification
id: b4d8e2f1-3a6c-4e9b-8d2f-1a5c7e3b9d09
status: experimental
description: Detects modifications to code signing policies, trusted publisher stores, or Authenticode verification settings that could allow unsigned or maliciously signed code to execute without warnings.
references:
    - https://attack.mitre.org/techniques/T1553/
    - https://attack.mitre.org/techniques/T1553/004/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.defense_evasion
    - attack.t1553
logsource:
    category: process_creation
    product: windows
detection:
    selection_bcdedit:
        Image|endswith: '\bcdedit.exe'
        CommandLine|contains:
            - 'testsigning'
            - 'nointegritychecks'
            - 'loadoptions DISABLE_INTEGRITY_CHECKS'
    selection_registry:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\CodeSigning'
            - '\SOFTWARE\Policies\Microsoft\Windows NT\Driver Signing'
            - '\SOFTWARE\Microsoft\Cryptography\OID\EncodingType'
            - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Authentication\CodeSigning'
    selection_powershell:
        CommandLine|contains:
            - 'Set-ExecutionPolicy Unrestricted'
            - 'Set-ExecutionPolicy Bypass'
            - 'Set-ExecutionPolicy RemoteSigned'
            - 'Set-AuthenticodeSignature'
    selection_signtool:
        Image|endswith: '\signtool.exe'
        CommandLine|contains: '/f '
    condition: selection_bcdedit or selection_registry or selection_powershell or selection_signtool
falsepositives:
    - Developers signing code during build processes
    - IT administrators configuring execution policies for deployment
    - Driver testing with test signing enabled
level: high
