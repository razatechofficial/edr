title: Execution Guardrails - Environment Checks Before Execution
id: b4d8e2f1-3a6c-4e9b-8d2f-1a5c7e3b9d12
status: experimental
description: Detects processes performing environment reconnaissance checks (hostname, domain, IP, username) immediately before executing payloads, which indicates environment-keyed malware that only runs on specific targets.
references:
    - https://attack.mitre.org/techniques/T1480/
    - https://attack.mitre.org/techniques/T1480/001/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.defense_evasion
    - attack.t1480
    - attack.t1480.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_env_checks:
        CommandLine|contains:
            - 'hostname'
            - 'whoami'
            - 'ipconfig'
            - 'systeminfo'
            - 'net config workstation'
            - 'wmic computersystem get'
            - '$env:COMPUTERNAME'
            - '$env:USERDOMAIN'
            - '[Environment]::MachineName'
            - '[Environment]::UserDomainName'
    selection_conditional_exec:
        CommandLine|contains:
            - ' && '
            - ' || '
            - 'if %COMPUTERNAME%'
            - 'if %USERDOMAIN%'
            - 'if ($env:'
    condition: selection_env_checks and selection_conditional_exec
falsepositives:
    - Deployment scripts that check environment before installing software
    - Configuration management tools (Ansible, Puppet, Chef)
    - Login scripts that customize user environments
level: medium
