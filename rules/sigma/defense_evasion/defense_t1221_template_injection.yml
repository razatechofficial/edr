title: Office Template Injection
id: b4d8e2f1-3a6c-4e9b-8d2f-1a5c7e3b9d08
status: experimental
description: Detects suspicious Office application behavior consistent with template injection attacks, where a document fetches a remote template containing malicious macros or exploits.
references:
    - https://attack.mitre.org/techniques/T1221/
    - https://blog.sunggwan.com/2018/02/05/ms-office-template-injection/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.defense_evasion
    - attack.t1221
logsource:
    category: process_creation
    product: windows
detection:
    selection_office_parent:
        ParentImage|endswith:
            - '\WINWORD.EXE'
            - '\EXCEL.EXE'
            - '\POWERPNT.EXE'
    selection_child_process:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\certutil.exe'
            - '\rundll32.exe'
    selection_network:
        ParentImage|endswith:
            - '\WINWORD.EXE'
            - '\EXCEL.EXE'
            - '\POWERPNT.EXE'
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - '\\\\' 
            - 'ftp://'
    condition: (selection_office_parent and selection_child_process) or selection_network
falsepositives:
    - Legitimate Office templates loaded from network shares
    - Office add-ins that spawn child processes
    - Macros that intentionally use command-line tools
level: high
