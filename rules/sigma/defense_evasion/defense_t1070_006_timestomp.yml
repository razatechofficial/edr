title: File Timestamp Manipulation - Timestomping
id: b4d8e2f1-3a6c-4e9b-8d2f-1a5c7e3b9d04
status: experimental
description: Detects attempts to modify file timestamps using tools like touch, PowerShell, or timestomping utilities to make malicious files blend in with legitimate system files.
references:
    - https://attack.mitre.org/techniques/T1070/006/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.defense_evasion
    - attack.t1070.006
logsource:
    category: process_creation
detection:
    selection_powershell_timestamp:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - '.CreationTime ='
            - '.LastWriteTime ='
            - '.LastAccessTime ='
            - 'Set-ItemProperty'
            - 'CreationTimeUtc'
            - 'LastWriteTimeUtc'
            - '[IO.File]::SetCreationTime'
            - '[IO.File]::SetLastWriteTime'
            - '[IO.File]::SetLastAccessTime'
    selection_nircmd:
        Image|endswith: '\nircmd.exe'
        CommandLine|contains: 'setfiletime'
    selection_linux_touch:
        Image|endswith: '/touch'
        CommandLine|contains:
            - ' -t '
            - ' -d '
            - ' --date='
            - ' -r '
            - '--reference='
    selection_linux_debugfs:
        Image|endswith: '/debugfs'
        CommandLine|contains: 'set_inode_field'
    condition: selection_powershell_timestamp or selection_nircmd or selection_linux_touch or selection_linux_debugfs
falsepositives:
    - Build systems that set consistent timestamps for reproducible builds
    - Backup restoration tools that preserve original timestamps
    - File synchronization tools (rsync with timestamp preservation)
level: high
