title: Browser Credential Store Access
id: c5e9f3a2-4b7d-4f1c-9e3a-2d6b8c4f1a02
status: experimental
description: Detects access to browser credential stores including Chrome, Firefox, Edge, and Opera password databases, which attackers target to harvest saved credentials.
references:
    - https://attack.mitre.org/techniques/T1555/003/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.credential_access
    - attack.t1555.003
logsource:
    category: file_access
detection:
    selection_chrome:
        TargetFilename|contains:
            - '\Google\Chrome\User Data\Default\Login Data'
            - '\Google\Chrome\User Data\Default\Cookies'
            - '\Google\Chrome\User Data\Local State'
            - '/google-chrome/Default/Login Data'
            - '/google-chrome/Default/Cookies'
    selection_firefox:
        TargetFilename|contains:
            - '\Mozilla\Firefox\Profiles\'
            - '/mozilla/firefox/'
        TargetFilename|endswith:
            - 'logins.json'
            - 'key4.db'
            - 'key3.db'
            - 'cert9.db'
            - 'cookies.sqlite'
    selection_edge:
        TargetFilename|contains:
            - '\Microsoft\Edge\User Data\Default\Login Data'
            - '\Microsoft\Edge\User Data\Default\Cookies'
    selection_opera:
        TargetFilename|contains:
            - '\Opera Software\Opera Stable\Login Data'
            - '\Opera Software\Opera Stable\Cookies'
    filter_browser_process:
        Image|endswith:
            - '\chrome.exe'
            - '\firefox.exe'
            - '\msedge.exe'
            - '\opera.exe'
            - '/chrome'
            - '/firefox'
    condition: (selection_chrome or selection_firefox or selection_edge or selection_opera) and not filter_browser_process
falsepositives:
    - Browser sync and update processes
    - Legitimate password management tools
    - Browser profile backup utilities
    - Anti-malware scanning of browser files
level: high
