title: Credential Files Discovery in Filesystem
id: c5e9f3a2-4b7d-4f1c-9e3a-2d6b8c4f1a03
status: experimental
description: Detects searches for files containing credentials, passwords, or sensitive configuration data in the filesystem using common command-line tools.
references:
    - https://attack.mitre.org/techniques/T1552/001/
author: EDR Agent Team
date: 2026-04-06
tags:
    - attack.credential_access
    - attack.t1552.001
logsource:
    category: process_creation
detection:
    selection_findstr:
        Image|endswith:
            - '\findstr.exe'
            - '\find.exe'
        CommandLine|contains:
            - 'password'
            - 'passwd'
            - 'credential'
            - 'secret'
            - 'api_key'
            - 'apikey'
            - 'token'
            - 'connectionstring'
    selection_grep:
        Image|endswith:
            - '/grep'
            - '/egrep'
            - '/rg'
        CommandLine|contains:
            - 'password'
            - 'passwd'
            - 'credential'
            - 'secret'
            - 'api_key'
            - 'token'
            - 'private_key'
    selection_dir_search:
        CommandLine|contains:
            - 'dir /s *password*'
            - 'dir /s *credential*'
            - 'dir /s *.config'
            - 'dir /s *vnc*.ini'
            - 'dir /s *unattend*'
            - 'dir /s web.config'
    selection_file_patterns:
        CommandLine|contains:
            - '.pgpass'
            - '.my.cnf'
            - '.netrc'
            - 'credentials.xml'
            - 'unattended.xml'
            - 'sysprep.xml'
            - 'web.config'
            - '.aws/credentials'
            - '.azure/accessTokens.json'
            - '.gcloud/credentials'
    condition: selection_findstr or selection_grep or selection_dir_search or selection_file_patterns
falsepositives:
    - Security auditing tools scanning for exposed credentials
    - Developers searching codebases for credential references
    - Configuration management tools
level: medium
