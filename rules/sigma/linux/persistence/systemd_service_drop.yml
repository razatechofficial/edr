title: Systemd Service Unit Drop
id: linux-systemd-drop-001
status: stable
description: Detects creation of systemd unit files in system paths for persistence
tags:
  - attack.persistence
  - attack.t1543.002
logsource:
  category: file_event
  product: linux
detection:
  selection:
    TargetFilename|endswith:
      - ".service"
    TargetFilename|contains:
      - "/etc/systemd/system/"
      - "/lib/systemd/system/"
      - "/usr/lib/systemd/system/"
  condition: selection
level: medium
