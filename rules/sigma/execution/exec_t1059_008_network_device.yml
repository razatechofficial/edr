title: Network Device CLI Execution
id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
status: experimental
description: Detects execution of network device management CLIs and remote configuration tools that may indicate lateral movement through network infrastructure
references:
    - https://attack.mitre.org/techniques/T1059/008/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1059.008
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        Image|endswith:
            - '\plink.exe'
            - '\putty.exe'
            - '\ssh.exe'
            - '\telnet.exe'
        CommandLine|contains:
            - 'enable'
            - 'configure terminal'
            - 'show running-config'
            - 'show startup-config'
            - 'copy running-config'
    selection_scripts:
        CommandLine|contains:
            - 'netmiko'
            - 'paramiko'
            - 'napalm'
            - 'expect -c'
            - 'autoexpect'
    selection_snmp:
        CommandLine|contains:
            - 'snmpset'
            - 'snmpwalk'
            - 'snmpget'
            - 'community string'
    condition: selection_tools or selection_scripts or selection_snmp
falsepositives:
    - Network administrators performing device management
    - Automated network configuration management (Ansible, Puppet)
    - SNMP-based monitoring tools
level: medium
