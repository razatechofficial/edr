title: Suspicious Shared Module Loading
id: 5e6f7a8b-9c0d-4e1f-2a3b-4c5d6e7f8a9b
status: experimental
description: Detects execution of regsvr32 or rundll32 with unusual DLL paths indicating potential abuse for code execution
references:
    - https://attack.mitre.org/techniques/T1129/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1129
logsource:
    category: process_creation
    product: windows
detection:
    selection_regsvr32:
        Image|endswith: '\regsvr32.exe'
        CommandLine|contains:
            - '\Temp\'
            - '\AppData\'
            - '\Users\Public\'
            - '\ProgramData\'
            - '\Downloads\'
            - '/s /n /u /i:'
            - 'scrobj.dll'
    selection_rundll32:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains:
            - '\Temp\'
            - '\AppData\'
            - '\Users\Public\'
            - '\ProgramData\'
            - '\Downloads\'
            - 'javascript:'
            - 'shell32.dll,Control_RunDLL'
    selection_unusual_ext:
        Image|endswith:
            - '\regsvr32.exe'
            - '\rundll32.exe'
        CommandLine|endswith:
            - '.tmp'
            - '.dat'
            - '.log'
            - '.txt'
            - '.jpg'
            - '.png'
            - '.bmp'
    condition: selection_regsvr32 or selection_rundll32 or selection_unusual_ext
falsepositives:
    - Legitimate software registering DLLs from user directories
    - Application installers using regsvr32
level: high
