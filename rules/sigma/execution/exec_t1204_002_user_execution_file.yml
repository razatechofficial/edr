title: User Execution via Malicious File
id: 8b9c0d1e-2f3a-4b4c-5d6e-7f8a9b0c1d2e
status: experimental
description: Detects execution of suspicious file types from user-accessible directories, indicating a user opened a malicious file attachment or download
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_script_engines:
        Image|endswith:
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
    selection_user_dirs:
        CommandLine|contains:
            - '\Downloads\'
            - '\Desktop\'
            - '\Documents\'
            - '\Users\Public\'
            - '\Temp\'
    selection_office_spawn:
        ParentImage|endswith:
            - '\WINWORD.EXE'
            - '\EXCEL.EXE'
            - '\POWERPNT.EXE'
            - '\MSACCESS.EXE'
            - '\MSPUB.EXE'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\certutil.exe'
    condition: (selection_script_engines and selection_user_dirs) or selection_office_spawn
falsepositives:
    - Legitimate macros in trusted Office documents
    - VBScript-based login scripts from user directories
level: high
