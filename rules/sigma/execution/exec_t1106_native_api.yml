title: Suspicious Native API Execution Indicators
id: 3c4d5e6f-7a8b-4c9d-0e1f-2a3b4c5d6e7f
status: experimental
description: Detects indicators of direct Windows API calls for process injection, memory manipulation, or code execution bypassing standard process creation
references:
    - https://attack.mitre.org/techniques/T1106/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1106
logsource:
    category: process_creation
    product: windows
detection:
    selection_rundll32:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains:
            - 'kernel32'
            - 'ntdll'
            - 'VirtualAlloc'
            - 'WriteProcessMemory'
            - 'CreateRemoteThread'
    selection_powershell_api:
        CommandLine|contains:
            - 'DllImport'
            - 'GetProcAddress'
            - 'GetModuleHandle'
            - 'VirtualAllocEx'
            - 'NtCreateThreadEx'
            - 'RtlCreateUserThread'
            - 'QueueUserAPC'
            - 'NtMapViewOfSection'
    selection_syscall:
        CommandLine|contains:
            - 'Add-Type'
            - 'System.Runtime.InteropServices'
            - '[DllImport('
            - 'Marshal.Copy'
            - 'Marshal.GetDelegateForFunctionPointer'
    condition: selection_rundll32 or selection_powershell_api or selection_syscall
falsepositives:
    - Legitimate software using P/Invoke for system integration
    - Development and debugging tools
level: high
