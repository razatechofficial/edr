title: Suspicious Container Deployment
id: 9c0d1e2f-3a4b-4c5d-6e7f-8a9b0c1d2e3f
status: experimental
description: Detects deployment of containers that may be used for execution, including privileged containers, host-mounted volumes, or suspicious images
references:
    - https://attack.mitre.org/techniques/T1610/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1610
logsource:
    category: process_creation
    product: linux
detection:
    selection_docker:
        CommandLine|contains:
            - 'docker run'
            - 'docker exec'
            - 'docker start'
    selection_kubectl:
        CommandLine|contains:
            - 'kubectl run'
            - 'kubectl exec'
            - 'kubectl create'
            - 'kubectl apply'
    selection_suspicious_flags:
        CommandLine|contains:
            - '--privileged'
            - '--pid=host'
            - '--net=host'
            - '--cap-add=SYS_ADMIN'
            - '--cap-add=ALL'
            - '-v /:/host'
            - '-v /etc:/'
            - '--security-opt apparmor=unconfined'
            - 'hostPID: true'
    selection_crypto:
        CommandLine|contains:
            - 'xmrig'
            - 'minerd'
            - 'cpuminer'
            - 'stratum+tcp'
            - 'cryptonight'
    condition: (selection_docker or selection_kubectl) and (selection_suspicious_flags or selection_crypto)
falsepositives:
    - DevOps engineers running privileged containers for legitimate infrastructure tasks
    - CI/CD pipeline container deployments
level: high
