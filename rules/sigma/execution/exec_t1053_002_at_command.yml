title: AT Command Scheduled Execution on Linux
id: 4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f8b
status: experimental
description: Detects use of the at command on Linux to schedule deferred execution
references:
    - https://attack.mitre.org/techniques/T1053/002/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.execution
    - attack.persistence
    - attack.t1053.002
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith:
            - '/at'
            - '/atq'
            - '/batch'
        CommandLine|contains:
            - 'sh'
            - 'bash'
            - 'curl'
            - 'wget'
            - 'python'
            - 'perl'
            - 'nc '
            - '/dev/tcp'
    condition: selection
falsepositives:
    - Legitimate cron-alternative job scheduling
    - Batch processing systems
level: medium
