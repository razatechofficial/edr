title: AT Command Scheduled Execution
id: 4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f8a
status: experimental
description: Detects use of the legacy AT command to schedule task execution, commonly abused for persistence and lateral movement
references:
    - https://attack.mitre.org/techniques/T1053/002/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.execution
    - attack.persistence
    - attack.t1053.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_at:
        Image|endswith: '\at.exe'
    selection_remote:
        CommandLine|contains:
            - '\\\\' 
    selection_content:
        CommandLine|contains:
            - '.exe'
            - '.bat'
            - '.cmd'
            - '.vbs'
            - '.ps1'
            - '/interactive'
    condition: selection_at and (selection_remote or selection_content)
falsepositives:
    - Legacy systems still using AT for task scheduling
    - Automated maintenance scripts on older Windows versions
level: high
