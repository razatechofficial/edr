title: Serverless Compute Execution Patterns
id: 0d1e2f3a-4b5c-4d6e-7f8a-9b0c1d2e3f4a
status: experimental
description: Detects suspicious creation, update, or invocation of serverless functions that may be used for execution in cloud environments
references:
    - https://attack.mitre.org/techniques/T1648/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.execution
    - attack.t1648
logsource:
    category: process_creation
    product: linux
detection:
    selection_aws_lambda:
        CommandLine|contains:
            - 'aws lambda create-function'
            - 'aws lambda update-function-code'
            - 'aws lambda invoke'
            - 'aws lambda add-permission'
    selection_azure_func:
        CommandLine|contains:
            - 'az functionapp create'
            - 'az functionapp deployment'
            - 'func azure functionapp publish'
    selection_gcp_func:
        CommandLine|contains:
            - 'gcloud functions deploy'
            - 'gcloud functions call'
            - 'gcloud run deploy'
    selection_suspicious:
        CommandLine|contains:
            - 'reverse_shell'
            - '/bin/bash'
            - 'curl'
            - 'wget'
            - 'nc '
            - 'ncat'
            - 'base64'
    condition: (selection_aws_lambda or selection_azure_func or selection_gcp_func) and selection_suspicious
falsepositives:
    - Cloud developers deploying serverless applications
    - CI/CD pipelines with serverless deployments
level: medium
