title: Peripheral Device Discovery
id: a5cd0b8d-e4ac-4e4b-d2a0-bbfac3bc2e49
status: experimental
description: Detects enumeration of peripheral devices such as USB drives, printers, and connected hardware
references:
    - https://attack.mitre.org/techniques/T1120/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.discovery
    - attack.t1120
logsource:
    category: process_creation
    product: windows
detection:
    selection_wmic:
        CommandLine|contains:
            - 'wmic path Win32_PnPEntity'
            - 'wmic path CIM_LogicalDevice'
            - 'wmic path CIM_DataFile'
            - 'wmic path Win32_USBHub'
            - 'wmic diskdrive'
            - 'wmic logicaldisk'
            - 'wmic printer'
    selection_powershell:
        CommandLine|contains:
            - 'Get-PnpDevice'
            - 'Get-WmiObject Win32_PnPEntity'
            - 'Get-CimInstance Win32_DiskDrive'
            - 'Get-CimInstance Win32_USBHub'
            - 'gwmi Win32_USBControllerDevice'
    selection_fsutil:
        CommandLine|contains:
            - 'fsutil fsinfo drives'
            - 'mountvol'
    condition: selection_wmic or selection_powershell or selection_fsutil
falsepositives:
    - Hardware inventory tools
    - IT asset management software
    - Printer management scripts
level: low
---
title: Peripheral Device Discovery on Linux/macOS
id: a5cd0b8d-e4ac-4e4b-d2a0-bbfac3bc2e50
status: experimental
description: Detects enumeration of USB and peripheral devices on Unix systems
references:
    - https://attack.mitre.org/techniques/T1120/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.discovery
    - attack.t1120
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'lsusb'
            - 'lspci'
            - 'lsblk'
            - 'fdisk -l'
            - 'system_profiler SPUSBDataType'
            - 'system_profiler SPHardwareDataType'
            - 'system_profiler SPStorageDataType'
            - 'ioreg -p IOUSB'
            - 'cat /proc/bus/usb/devices'
            - 'usb-devices'
    condition: selection
falsepositives:
    - Hardware diagnostics
    - System inventory tools
level: low
