title: Domain Account Enumeration
id: 8d4b2f05-6e9a-4c73-ba28-3f7e5a9d4c61
status: experimental
description: Detects commands used to enumerate domain user and group accounts via net commands, PowerShell AD cmdlets, or LDAP queries
references:
    - https://attack.mitre.org/techniques/T1087/002/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.discovery
    - attack.t1087.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_net:
        CommandLine|contains:
            - 'net group /domain'
            - 'net user /domain'
            - 'net group "Domain Admins"'
            - 'net group "Domain Users"'
            - 'net group "Enterprise Admins"'
    selection_powershell:
        CommandLine|contains:
            - 'Get-ADUser'
            - 'Get-ADGroup'
            - 'Get-ADComputer'
            - 'Get-ADGroupMember'
            - 'Search-ADAccount'
            - 'Get-ADObject'
    selection_dsquery:
        Image|endswith:
            - '\dsquery.exe'
            - '\dsget.exe'
    selection_ldap:
        CommandLine|contains:
            - 'ldapsearch'
            - 'ldapwhoami'
            - 'LDAP://'
            - '[adsi]'
            - 'DirectorySearcher'
    condition: selection_net or selection_powershell or selection_dsquery or selection_ldap
falsepositives:
    - Active Directory administration tasks
    - Automated domain inventory scripts
    - IT management software
level: medium
