title: System Service Enumeration
id: f4bc9a7c-d3fb-4d3a-c19f-aaefb2ab1d38
status: experimental
description: Detects enumeration of system services to identify running daemons, scheduled services, or security software
references:
    - https://attack.mitre.org/techniques/T1007/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.discovery
    - attack.t1007
logsource:
    category: process_creation
    product: windows
detection:
    selection_sc:
        Image|endswith: '\sc.exe'
        CommandLine|contains:
            - 'query'
            - 'queryex'
            - 'qc '
    selection_net:
        CommandLine|contains:
            - 'net start'
            - 'net1 start'
    selection_wmic:
        CommandLine|contains:
            - 'wmic service'
            - 'wmic service list'
            - 'wmic service get'
    selection_powershell:
        CommandLine|contains:
            - 'Get-Service'
            - 'Get-CimInstance Win32_Service'
            - 'Get-WmiObject Win32_Service'
    condition: selection_sc or selection_net or selection_wmic or selection_powershell
falsepositives:
    - Service health monitoring scripts
    - System administration tooling
level: low
---
title: System Service Enumeration on Linux/macOS
id: f4bc9a7c-d3fb-4d3a-c19f-aaefb2ab1d39
status: experimental
description: Detects service enumeration on Unix systems via systemctl, launchctl, or service commands
references:
    - https://attack.mitre.org/techniques/T1007/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.discovery
    - attack.t1007
logsource:
    category: process_creation
    product: linux
detection:
    selection_systemctl:
        CommandLine|contains:
            - 'systemctl list-units'
            - 'systemctl list-unit-files'
            - 'systemctl status'
            - 'systemctl --type=service'
    selection_service:
        CommandLine|contains:
            - 'service --status-all'
            - 'chkconfig --list'
            - 'initctl list'
    selection_launchctl:
        CommandLine|contains:
            - 'launchctl list'
            - 'launchctl print'
    condition: selection_systemctl or selection_service or selection_launchctl
falsepositives:
    - System administration and monitoring
    - Configuration management tools
level: low
