title: Local Account Enumeration
id: 7c3a1e94-5d8f-4b62-a917-2e6d4f8c3b50
status: experimental
description: Detects commands commonly used to enumerate local user accounts on Windows, Linux, and macOS systems
references:
    - https://attack.mitre.org/techniques/T1087/001/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.discovery
    - attack.t1087.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_net:
        CommandLine|contains:
            - 'net user'
            - 'net1 user'
    selection_wmic:
        CommandLine|contains: 'wmic useraccount'
    selection_powershell:
        CommandLine|contains:
            - 'Get-LocalUser'
            - 'Get-WmiObject Win32_UserAccount'
    selection_cmd:
        Image|endswith:
            - '\whoami.exe'
        CommandLine|contains: '/all'
    condition: selection_net or selection_wmic or selection_powershell or selection_cmd
falsepositives:
    - Administrative scripts auditing local accounts
    - Help desk tools performing user lookups
    - System inventory software
level: low
---
title: Local Account Enumeration via Unix Commands
id: 7c3a1e94-5d8f-4b62-a917-2e6d4f8c3b51
status: experimental
description: Detects local account enumeration on macOS and Linux using dscl, /etc/passwd reads, or id commands
references:
    - https://attack.mitre.org/techniques/T1087/001/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.discovery
    - attack.t1087.001
logsource:
    category: process_creation
    product: linux
detection:
    selection_dscl:
        CommandLine|contains:
            - 'dscl . list /Users'
            - 'dscl . -list /Users'
            - 'dscl . readall /Users'
    selection_passwd:
        CommandLine|contains:
            - 'cat /etc/passwd'
            - 'cut -d: -f1 /etc/passwd'
            - 'awk -F: /etc/passwd'
            - 'getent passwd'
    selection_compgen:
        CommandLine|contains: 'compgen -u'
    condition: selection_dscl or selection_passwd or selection_compgen
falsepositives:
    - System administration scripts
    - Configuration management tools
level: low
