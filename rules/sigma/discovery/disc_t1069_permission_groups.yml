title: Permission Group Discovery
id: af6d4b27-8eac-4e95-dc4a-5b9a7cbf6e83
status: experimental
description: Detects enumeration of local and domain permission groups to identify privilege boundaries
references:
    - https://attack.mitre.org/techniques/T1069/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.discovery
    - attack.t1069
    - attack.t1069.001
    - attack.t1069.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_net_local:
        CommandLine|contains:
            - 'net localgroup'
            - 'net1 localgroup'
            - 'net localgroup administrators'
            - 'net localgroup "Remote Desktop Users"'
    selection_net_domain:
        CommandLine|contains:
            - 'net group /domain'
            - 'net group "Domain Admins" /domain'
            - 'net group "Schema Admins" /domain'
    selection_powershell:
        CommandLine|contains:
            - 'Get-LocalGroupMember'
            - 'Get-ADGroupMember'
            - 'Get-ADPrincipalGroupMembership'
    selection_gpresult:
        Image|endswith: '\gpresult.exe'
    condition: selection_net_local or selection_net_domain or selection_powershell or selection_gpresult
falsepositives:
    - System administrators checking group memberships
    - Logon scripts
    - Group policy troubleshooting
level: low
---
title: Permission Group Discovery on Linux/macOS
id: af6d4b27-8eac-4e95-dc4a-5b9a7cbf6e84
status: experimental
description: Detects enumeration of groups and group memberships on Unix systems
references:
    - https://attack.mitre.org/techniques/T1069/
author: EDR Agent
date: 2026-04-06
tags:
    - attack.discovery
    - attack.t1069
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains:
            - 'groups'
            - 'id'
            - 'cat /etc/group'
            - 'getent group'
            - 'dscacheutil -q group'
            - 'dscl . -list /Groups'
            - 'lid -g'
    condition: selection
falsepositives:
    - Shell initialization scripts invoking id or groups
    - Configuration management tools
level: low
