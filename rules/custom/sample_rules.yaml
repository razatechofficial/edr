# Custom detection rules: YAML list of rules; each `expression` is CEL against
# OCSF 1.3 variables (class_uid, process_cmd_line, process_file_name, etc.).
rules:
  - id: SAMPLE-CEL-001
    name: Sample CEL rule (never matches)
    description: >
      Template rule with a valid CEL expression. Replace or set enabled false
      before production; expression "false" matches nothing.
    severity: low
    expression: "false"
    mitre: []
    tags: ["sample", "custom-cel"]
    enabled: true
