agent:
  log_level: info
  data_dir: "C:\\ProgramData\\EDR Agent"
  temp_dir: "C:\\ProgramData\\EDR Agent\\tmp"
logging:
  level: info
  alert_file: "C:\\ProgramData\\EDR Agent\\alerts.jsonl"
  audit_file: "C:\\ProgramData\\EDR Agent\\audit.jsonl"
server:
  endpoint: ""
  mutual_tls: false
  heartbeat_sec: 30
  reconnect_sec: 5
detection:
  sigma:
    enabled: true
    rules_dir: "C:\\ProgramData\\EDR Agent\\rules\\sigma"
  yara:
    enabled: true
    rules_dir: "C:\\ProgramData\\EDR Agent\\rules\\yara"
  custom_rules:
    enabled: true
    rules_path: "C:\\ProgramData\\EDR Agent\\rules\\custom"
  ioc:
    enabled: true
    hash_db_path: "C:\\ProgramData\\EDR Agent\\rules\\ioc\\hashes.json"
    ip_db_path: "C:\\ProgramData\\EDR Agent\\rules\\ioc\\ips.csv"
    domain_db_path: "C:\\ProgramData\\EDR Agent\\rules\\ioc\\domains.csv"
  behavioral:
    sensitivity: high
    ransomware_detect: true
    rat_detect: true
    exfil_detect: true
    lateral_movement_detect: true
monitoring:
  mode: auto
  kernel_enabled: true
  userland_fallback: true
  require_kernel: false
  windows_ppl_required: false
  etw_threat_intel: false
  security_profile: standard
compliance:
  enabled: true
  rules_dir: "C:\\ProgramData\\EDR Agent\\rules\\compliance\\sca"
  scan_on_start: true
  interval_hours: 12
  enable_posture: true
  enable_rootcheck: false
  emit_passed_findings: false
ml:
  enabled: true
  require_runtime: false
  models_dir: "C:\\ProgramData\\EDR Agent\\models"
  auto_update: false
  models:
    pe_classifier: pe_classifier.onnx
    behavior_lstm: behavior_lstm.onnx
    network_anomaly: network_anomaly.onnx
    ransomware: ransomware.onnx
    network_lgbm: network_lgbm.onnx
    rat_c2_detector: rat_c2_detector.onnx
  thresholds:
    pe_malicious: 0.80
    behavior_anomaly: 0.75
    ransomware_score: 0.85
    network_anomaly: 0.70
self_protect:
  enabled: false
response:
  auto_response: true
  playbooks_dir: "C:\\ProgramData\\EDR Agent\\rules\\playbooks"
  forensics_dir: "C:\\ProgramData\\EDR Agent\\forensics"
  quarantine_dir: "C:\\ProgramData\\EDR Agent\\quarantine"
  approval:
    mode: auto
