agent:
  log_level: info
  data_dir: /var/lib/edr-agent
  temp_dir: /tmp/edr-agent
rules_file: /etc/edr-agent/rules/baseline.yaml
logging:
  level: info
  alert_file: /var/lib/edr-agent/alerts.jsonl
  audit_file: /var/lib/edr-agent/audit.jsonl
detection:
  sigma:
    enabled: true
    rules_dir: /etc/edr-agent/rules/sigma
  yara:
    enabled: true
    rules_dir: /etc/edr-agent/rules/yara
  custom_rules:
    enabled: true
    rules_path: /etc/edr-agent/rules/custom
  ioc:
    enabled: true
    hash_db_path: /etc/edr-agent/rules/ioc/hashes.json
    ip_db_path: /etc/edr-agent/rules/ioc/ips.csv
    domain_db_path: /etc/edr-agent/rules/ioc/domains.csv
  behavioral:
    sensitivity: high
    ransomware_detect: true
    rat_detect: true
    exfil_detect: true
    lateral_movement_detect: true
monitoring:
  mode: auto
  kernel_enabled: true
  fim_preset: standard
  linux_auth_auto_journal: true
  linux_rootcheck_enabled: true
compliance:
  enabled: true
  rules_dir: /etc/edr-agent/rules/compliance/sca
  scan_on_start: true
  interval_hours: 12
  enable_posture: true
  enable_rootcheck: true
  emit_passed_findings: false
ml:
  enabled: true
  require_runtime: false
  models_dir: /usr/share/edr-agent/models
  auto_update: false
  models:
    pe_classifier: pe_classifier.onnx
    behavior_lstm: behavior_lstm.onnx
    network_anomaly: network_anomaly.onnx
    ransomware: ransomware.onnx
    network_lgbm: network_lgbm.onnx
    rat_c2_detector: rat_c2_detector.onnx
  thresholds:
    pe_malicious: 0.80
    behavior_anomaly: 0.75
    ransomware_score: 0.85
    network_anomaly: 0.70
llm:
  enabled: false
  rag:
    enabled: true
xdr:
  # Public defaults; enroll with: sudo edrctl enroll --token <TOKEN>
  # Sensor starts without credentials; ingest opens after enroll (+ auto restart).
  enabled: true
  enrollment_host: enroll.xdr.averox.com:443
  ingest_hosts:
    - ingest.xdr.averox.com:443
  spool_max_bytes: 1073741824
  spool_max_age_days: 7
performance:
  profile: low_resource
  max_memory_mb: 512
  worker_count: 2
  event_buffer_size: 2048
response:
  auto_response: true
  playbooks_path: /etc/edr-agent/rules/playbooks/playbooks.yml
  playbooks_dir: /etc/edr-agent/rules/playbooks
  forensics_dir: /var/lib/edr-agent/forensics
  quarantine_dir: /var/lib/edr-agent/quarantine
  approval:
    mode: auto
self_protect:
  enabled: true
  watchdog: true
  anti_debug: true
  integrity_check: true
