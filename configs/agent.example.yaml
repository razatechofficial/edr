service:
  endpoint_id: "host-dev-01"
  tick_interval: "1s"
  pid_file: "./alerts/agent.pid"
rules_file: "rules/baseline.yaml"

logging:
  level: "info"
  alert_file: "./alerts/alerts.jsonl"
  audit_file: "./alerts/audit.jsonl"

response:
  allow_kill: true
  auto_kill_enabled: true
  min_kill_score: 90
  kill_rule_allowlist:
    - "PROC-003"
    - "PROC-004"
    - "PROC-005"
    - "PROC-007"
    - "PROC-009"
    - "PROC-012"
  protected_processes:
    - "systemd"
    - "launchd"
    - "wininit.exe"

forwarder:
  enabled: false
  mode: "http"
  endpoint: "http://localhost:8080/ingest"
