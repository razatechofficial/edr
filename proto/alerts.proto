// Alert definitions for the EDR detection pipeline.
// These types mirror the Go structs in internal/schema/alerts.go and
// pkg/events/types.go.

syntax = "proto3";

package edr;

option go_package = "github.com/razatechofficial/edr/pkg/protocol";

import "google/protobuf/timestamp.proto";

// Severity represents the severity level of a detection alert.
enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_INFO        = 1;
  SEVERITY_LOW         = 2;
  SEVERITY_MEDIUM      = 3;
  SEVERITY_HIGH        = 4;
  SEVERITY_CRITICAL    = 5;
}

// MITREAttack represents a reference to a MITRE ATT&CK technique.
message MITREAttack {
  string technique_id   = 1;
  string technique_name = 2;
  string tactic_id      = 3;
  string tactic_name    = 4;
}

// Alert represents a detection alert generated by a rule engine.
message Alert {
  string                    alert_id       = 1;
  string                    rule_id        = 2;
  string                    rule_name      = 3;
  string                    endpoint_id    = 4;
  Severity                  severity       = 5;
  int32                     score          = 6;
  string                    title          = 7;
  string                    description    = 8;
  google.protobuf.Timestamp timestamp      = 9;
  repeated MITREAttack      mitre          = 10;
  repeated string           tags           = 11;

  // Process context from the triggering event.
  int32  process_pid     = 20;
  string process_name    = 21;
  string process_path    = 22;
  string command_line    = 23;

  // Raw event data for forensic purposes.
  bytes  raw_event       = 30;

  // Canonical OCSF 1.3 Detection Finding JSON (class 2004).
  bytes  ocsf            = 31;
}

// AlertAck is the server's acknowledgment of a received alert.
message AlertAck {
  string alert_id  = 1;
  bool   accepted  = 2;
  string message   = 3;
}

// AuditRecord represents an auditable action taken by the agent.
message AuditRecord {
  string                    schema_version = 1;
  string                    record_id      = 2;
  string                    action         = 3;
  string                    outcome        = 4;
  string                    message        = 5;
  google.protobuf.Timestamp timestamp      = 6;
}
